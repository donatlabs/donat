name: Release image

# Build and publish the engine image on every release tag (e.g. v1.2.3).
#
# It goes to GitHub Container Registry first, because `ghcr.io/donatlabs/donat`
# is the name the README, every example compose file and the Petshop docs tell
# people to pull — a release that only reached Docker Hub left the documented
# `docker compose up` unable to resolve an image at all. Docker Hub is kept as a
# mirror for deployments already pointed at it.
#
# Both repositories are public, so deployments pull without authenticating.

on:
  push:
    tags:
      - "v*"
  # Allow a manual run from the Actions tab (tags as :latest only).
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/donatlabs/donat
  DOCKERHUB_IMAGE: docker.io/partyproject/donat

jobs:
  # One native runner per architecture. Compiling this workspace for arm64
  # under QEMU emulation takes hours; an arm64 runner takes the same time as
  # the amd64 one. Each leg pushes an unnamed digest, and `manifest` publishes
  # the tags that point at both.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Mapped into `env` because the `secrets` context is not available in a
    # step's `if:`, and a fork without these credentials must still release.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional mirror: a fork, or a repository without these secrets, still
      # publishes the image the documentation names.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          for tag in $(jq -cr '.tags | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create \
              -t "${tag/${GHCR_IMAGE}/${DOCKERHUB_IMAGE}}" "$tag"
          done
