name: Release image

# Build and publish the engine image on every release tag (e.g. v1.2.3).
#
# It goes to GitHub Container Registry first, because `ghcr.io/donatlabs/donat`
# is the name the README, every example compose file and the Petshop docs tell
# people to pull — a release that only reached Docker Hub left the documented
# `docker compose up` unable to resolve an image at all. Docker Hub is kept as a
# mirror for deployments already pointed at it.
#
# Both repositories are public, so deployments pull without authenticating.

on:
  push:
    tags:
      - "v*"
  # Allow a manual run from the Actions tab (tags as :latest only).
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/donatlabs/donat
  DOCKERHUB_IMAGE: docker.io/partyproject/donat

jobs:
  # One native runner per architecture. Compiling this workspace for arm64
  # under QEMU emulation takes hours; an arm64 runner takes the same time as
  # the amd64 one. Each leg pushes an unnamed digest, and `manifest` publishes
  # the tags that point at both.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Mapped into `env` because the `secrets` context is not available in a
    # step's `if:`, and a fork without these credentials must still release.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional mirror: a fork, or a repository without these secrets, still
      # publishes the image the documentation names.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          for tag in $(jq -cr '.tags | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create \
              -t "${tag/${GHCR_IMAGE}/${DOCKERHUB_IMAGE}}" "$tag"
          done

  # The published artifact, exercised the way a user meets it: `docker compose
  # up` on an example, against the image the manifest job just pushed —
  # anonymously, because that is how a user pulls it.
  #
  # This job exists because both of its failure modes have already happened.
  # The ghcr package sat private from its first publish, so every documented
  # `docker compose up` failed at the pull for anyone outside the repository;
  # and the REST example could not boot for weeks (`donat.check_violation` is
  # checked at serve time, and the compose never applied the engine's own
  # migrations) — masked by exactly that private image. A release that only
  # builds proves the build; this proves the release.
  smoke:
    name: Smoke the published image
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No packages permission on purpose: the pull must succeed with no
    # credentials at all, or the package visibility has regressed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the published version tag
        id: version
        # The metadata action strips the leading `v`, so the image tag for
        # `v1.2.3` is `1.2.3`. A manual dispatch has no version tag and
        # smokes `latest` instead.
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "engine_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "engine_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: The image must be pullable anonymously
        run: |
          docker logout ghcr.io 2>/dev/null || true
          docker pull "${GHCR_IMAGE}:${ENGINE_TAG}"
        env:
          ENGINE_TAG: ${{ steps.version.outputs.engine_tag }}

      - name: The engine's migrations must be inside it
        run: |
          count=$(docker run --rm --entrypoint sh "${GHCR_IMAGE}:${ENGINE_TAG}" \
            -c 'ls /usr/share/donat/migrations/*.sql | wc -l')
          test "$count" -ge 12 || { echo "expected >=12 migrations, found $count"; exit 1; }
        env:
          ENGINE_TAG: ${{ steps.version.outputs.engine_tag }}

      - name: The REST example must come up from the published image
        working-directory: examples/petshop-rest
        run: docker compose up -d --quiet-pull --wait --wait-timeout 180
        env:
          ENGINE_TAG: ${{ steps.version.outputs.engine_tag }}

      - name: It must serve, refuse, and answer
        working-directory: examples/petshop-rest
        run: |
          for _ in $(seq 1 30); do
            curl -sf -m 2 localhost:8080/healthz >/dev/null && break
            sleep 2
          done
          curl -sf -m 5 localhost:8080/healthz

          # The seeded catalogue, as the anonymous role.
          body=$(curl -sf -m 5 'localhost:8080/api/rest/pets?limit=3' \
            -H 'X-Donat-Admin-Secret: petshop-secret' -H 'X-Donat-Role: anonymous')
          grep -q '"name":"Rex"' <<< "$body" || { echo "unexpected pets body: $body"; exit 1; }

          # A permission is proven by what it refuses: a role-less request to
          # an unknown path gets the role error, never a 404 to enumerate by.
          refusal=$(curl -sf -m 5 localhost:8080/api/rest/does/not/exist \
            -H 'X-Donat-Admin-Secret: petshop-secret')
          grep -q 'x-donat-role header is required' <<< "$refusal" \
            || { echo "expected the role-required refusal, got: $refusal"; exit 1; }

      # The image carries the admin panel and serves it itself, so the release
      # has to prove both halves of that: the panel is reachable, and it has
      # not swallowed the engine's own paths. A single-page app answers every
      # unmatched path with its HTML, and the failure that would cause is
      # silent — a wrong API URL returning a page and HTTP 200.
      - name: The published image must serve the panel, and only the panel
        working-directory: examples/petshop-rest
        run: |
          page=$(curl -sf -m 5 localhost:8080/)
          grep -qi '<!doctype html' <<< "$page" \
            || { echo "expected the panel at /, got: $(head -c 120 <<< "$page")"; exit 1; }

          # A route the panel reaches by a whole page load rather than by its
          # own router: the engine redirects an emailed reset link here.
          curl -sf -m 5 localhost:8080/account >/dev/null \
            || { echo "the panel's own routes must survive a hard load"; exit 1; }

          # And a path that is the engine's stays the engine's, wrong or right.
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 5 localhost:8080/v1/graphqlx)
          test "$status" = 404 \
            || { echo "a mistyped engine path answered $status, not 404"; exit 1; }

      - name: Engine logs on failure
        if: failure()
        working-directory: examples/petshop-rest
        run: docker compose logs --tail 50
