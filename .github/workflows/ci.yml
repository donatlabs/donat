name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every job carries a `timeout-minutes`, because the default is six hours and
# nothing here takes ten minutes. A runner that is lost mid-step does not fail:
# it holds the job until something upstream gives up, and a branch waits on a
# check that will never answer — which is how one lost runner ate 45 minutes in
# a step that takes 45 seconds. The budgets below are roughly three times the
# observed time with a warm cache, which is loose enough for a cold one and
# still turns a hang into a failure while it is worth looking at.
jobs:
  # Cheap, no services, and the first thing to go red on a mechanical mistake.
  # The toolchain is pinned in rust-toolchain.toml, so what counts as formatted
  # and what clippy warns about are properties of the repository rather than of
  # whichever stable happened to be current on the runner.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Formatting
        run: cargo fmt --all --check
      # --all-targets covers tests and benches: a lint that only fires in test
      # code is still a lint, and those files are read as often as any other.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The connector source-identity check reads the reviewed bytes out of
          # the commit its source record pins — `git show <commit>:<path>` —
          # which a shallow checkout does not have. Verifying a record against
          # a commit is the point of it, so the history has to be here.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Connector processor boundary policy
        run: python3 scripts/check_connector_processor_boundary.py
      # The durable Process journals, the command claim ledger and catalog
      # introspection are all contracts against a real database, so their
      # tests need one. They live in the ordinary crates rather than in the
      # conformance harness because they test one crate's behaviour, not the
      # engine end to end.
      - name: Start Postgres
        run: docker compose -f docker-compose.conformance.yml up -d --wait postgres
      - name: Workspace tests
        run: cargo test --workspace --exclude donat-conformance

  backend-core:
    name: Shared conformance (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
          - backend: sqlite
          - backend: mysql
          - backend: clickhouse
    env:
      CONF_BACKEND: ${{ matrix.backend }}
      PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/postgres
      MYSQL_URL: mysql://root:root@127.0.0.1:13306/donat
      CLICKHOUSE_URL: http://donat:donat@127.0.0.1:18123
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.backend }}
      - name: Start backend service
        if: matrix.backend != 'sqlite'
        run: docker compose -f docker-compose.conformance.yml up -d --wait "${{ matrix.backend }}"
      - name: Build engine
        run: cargo build -p donat-server --bin donat
      - name: Matrix registry and manifest guards
        run: cargo test -p donat-conformance --lib
      - name: Shared backend contract
        run: cargo test -p donat-conformance --test backend_matrix -- --test-threads=4 --nocapture
        env:
          RUST_BACKTRACE: "1"
      # Every server test that needs a live MySQL belongs in this list. A test
      # that talks to MySQL and is *not* named here still runs in the workspace
      # job, where there is no MySQL — and its guard turns that into a printed
      # "skipping" line and a pass, so an absent name is an untested test rather
      # than a failing one. `DONAT_EXTERNAL_DB_TESTS` is what makes the guards
      # here panic instead of skipping.
      - name: Live MySQL runtime tests
        if: matrix.backend == 'mysql'
        run: |
          cargo test -p donat-server \
            --test mysql_e2e \
            --test mysql_runtime \
            --test mysql_mutations \
            --test multi_source_runtime -- --nocapture
        env:
          DONAT_EXTERNAL_DB_TESTS: "1"
      - name: Live ClickHouse runtime tests
        if: matrix.backend == 'clickhouse'
        run: cargo test -p donat-server --test clickhouse_runtime -- --include-ignored --nocapture
        env:
          DONAT_EXTERNAL_DB_TESTS: "1"
      # File attachments have no local-disk backend: every one of their cases
      # goes to an S3-compatible store, so the Postgres reference leg needs one
      # exactly the way it needs a database.
      - name: Start the object store
        if: matrix.backend == 'postgres'
        run: |
          docker compose -f docker-compose.conformance.yml up -d --wait minio
          docker compose -f docker-compose.conformance.yml run --rm minio-init
      - name: Full Postgres reference conformance
        if: matrix.backend == 'postgres'
        run: env -u MYSQL_URL -u CLICKHOUSE_URL cargo test -p donat-conformance -- --test-threads=4
        env:
          RUST_BACKTRACE: "1"
          S3_URL: http://127.0.0.1:19000

  backend-core-gate:
    name: Conformance matrix
    if: always()
    needs: backend-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every backend
        run: test '${{ needs.backend-core.result }}' = success

  mixed-backend-conformance:
    name: Mixed Postgres and ClickHouse conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DONAT_EXTERNAL_DB_TESTS: "1"
      PG_URL: postgresql://postgres:postgres@127.0.0.1:15432/postgres
      CLICKHOUSE_URL: http://donat:donat@127.0.0.1:18123
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mixed-postgres-clickhouse
      - name: Start Postgres and ClickHouse
        run: docker compose -f docker-compose.conformance.yml up -d --wait postgres clickhouse
      - name: Build engine
        run: cargo build -p donat-server --bin donat
      - name: Multi-database and multi-source contracts
        run: |
          cargo test -p donat-conformance \
            --test clickhouse_multi_database \
            --test multi_source \
            --test tandt_clickhouse_contract -- \
            --test-threads=1 --nocapture

  admin-panel:
    name: Admin panel (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own npm project, outside the Cargo workspace and outside `make test`
    # — which until now meant outside CI as well. That stopped being tolerable
    # when the engine's image began building the panel into itself: a panel
    # that does not compile is now an engine image that does not build, and the
    # first place anyone would find out was a release.
    #
    # The build is here for the same reason the tests are. `tsc` and `vitest`
    # both pass on code Vite refuses, and it is Vite's output the engine
    # serves.
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit and mount tests
        run: npm test
      # `build` is `tsc --noEmit && vite build`, so this is the type check too.
      # Both are here because they disagree: code `tsc` accepts, Vite can still
      # refuse, and it is Vite's output the engine serves.
      - name: Types and build
        run: npm run build

  go-sdk:
    name: Go SDK (cgo-free, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      # The core is a build output and lives only on release tags, so a
      # checkout of a branch has to build it before any Go code compiles —
      # `//go:embed` needs the file present.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: go-sdk-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - name: Build the embedded core
        run: make wasm-core
        working-directory: .
      # The hard packaging constraint (specs/003): the SDK must be
      # go-get-able and statically buildable with no cgo.
      - name: Build with cgo disabled
        run: CGO_ENABLED=0 go build ./...
      - name: Test (unit + integration + conformance subset)
        run: CGO_ENABLED=0 go test ./...
        env:
          # DONAT_TEST_PG enables integration tests (executor, handler, conformance
          # subset) against the postgres service defined above. The service is mapped
          # to host port 15432 so the default pgTestDSN() works unchanged.
          DONAT_TEST_PG: "1"
      - name: Vet
        run: go vet ./...
      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  # The wasm core is committed as a blob so that `go get` needs no Rust
  # toolchain, which means nothing otherwise notices when a crate below it
  # changes and the blob stops matching the sources. This job rebuilds it and
  # runs the Go host against the fresh artifact.
  wasm-core:
    name: Go SDK (wasm core rebuilds from source)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - name: Rebuild the embedded core
        run: make wasm-core
      - name: Test the Go host against the freshly built core
        run: CGO_ENABLED=0 go test ./...
        working-directory: sdk/go

  # The lending example is where the embedded core is exercised against real
  # declarative metadata: three commands, three rules and an event handler,
  # driven through the engine's own handler against Postgres.
  lending-example:
    name: Lending example (commands, rules, in-process handlers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The example's storage backend resolves its credentials from the
    # environment, and every command that reads the metadata directory —
    # `migrate --metadata-dir`, `validate`, `dump-core-config` — resolves them
    # too. Declared once for the job rather than per step: an unset one is a
    # deploy failure by design, so a step that forgets them fails for a reason
    # that has nothing to do with what it was testing.
    env:
      LENDING_S3_KEY: minioadmin
      LENDING_S3_SECRET: minioadmin
      LENDING_SIGNING_SECRET: dev-signing-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lending
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - name: Build the engine binary (for migrate)
        run: cargo build -p donat-server --bin donat
      # The platform's own catalog, then the example's tables. The example
      # deliberately carries no copy of the platform's DDL.
      - name: Apply the platform's migrations
        run: ./target/debug/donat --database-url "$URL" migrate --migrations-dir migrations
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
      - name: Apply the example's migrations
        run: ./target/debug/donat --database-url "$URL" migrate --migrations-dir examples/lending-golang/migrations
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
      # The third step of the deploy model. `borrow_copy` starts a durable
      # Process, and the journal row it writes names the revision by foreign
      # key — so without this every borrow fails on that constraint rather
      # than on anything a caller did.
      - name: Deploy the Process revisions
        run: |
          ./target/debug/donat --database-url "$URL" migrate \
            --migrations-dir migrations \
            --metadata-dir examples/lending-golang/metadata --source default
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
          DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
      - name: Metadata must be consistent with the database
        run: ./target/debug/donat --database-url "$URL" validate --metadata-dir examples/lending-golang/metadata
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
          DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
      # Same reason as the snapshot below: the wasm core is a build output and
      # lives only on release tags, so a branch checkout has to build it before
      # any Go code that embeds it will compile.
      - name: Build the embedded core
        run: make wasm-core
      # The snapshot the example embeds is a build output, not source: it is
      # the metadata directory compiled against the live catalog, so it can
      # only be produced once the database is migrated. Committing it would
      # mean shipping a file that goes stale while still looking valid.
      - name: Compile the core snapshot
        run: |
          ./target/debug/donat --database-url "$URL" dump-core-config \
            --metadata-dir examples/lending-golang/metadata \
            --out examples/lending-golang/core-config.json
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
          DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/lending
      - name: Test
        run: CGO_ENABLED=0 go test ./...
        working-directory: examples/lending-golang
        env:
          LENDING_TEST_PG: postgresql://postgres:postgres@127.0.0.1:15432/lending
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
        working-directory: examples/lending-golang
      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: examples/lending-golang

  audit:
    name: Security advisories (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Run cargo-audit directly instead of rustsec/audit-check: the latter
      # creates a GitHub check-run, which fails ("Resource not accessible by
      # integration") unless the workflow is granted `checks: write`.
      #
      # `--deny warnings` keeps the gate strict: any vulnerability or
      # informational advisory (unsound, unmaintained, yanked) fails the job.
      - name: cargo audit
        run: cargo audit --deny warnings

  petshop-system:
    name: Petshop system tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Raises the example the way its README deploys it — migrate, deploy the
      # Process revisions, then serve — with the engine built from this commit.
      - name: Raise the stand
        run: tests-system/stack.sh up
      # The same store with its declared periods rewritten to seconds. Without
      # it every deadline branch — dunning, expiries, unanswered approvals —
      # skips itself, and the run is green having tested none of them.
      - name: Raise the fast stand
        run: tests-system/stack.sh up-fast
      - name: Install the suite
        run: |
          python3 -m venv tests-system/.venv
          tests-system/.venv/bin/pip install -q -r tests-system/requirements.txt
      - name: Black-box system tests
        working-directory: tests-system
        env:
          PETSHOP_BASE_URL: http://127.0.0.1:8080
          PETSHOP_PROVIDERS_URL: http://127.0.0.1:8099
          PETSHOP_FAST_BASE_URL: http://127.0.0.1:8081
          PETSHOP_FAST_PROVIDERS_URL: http://127.0.0.1:8098
        run: .venv/bin/python -m pytest -q
      - name: Engine log
        if: failure()
        run: |
          tail -200 tests-system/.stack/engine.log
          tail -200 tests-system/.stack/engine-fast.log
      - name: Drop the stand
        if: always()
        run: |
          tests-system/stack.sh down-fast
          tests-system/stack.sh down

  # The claim the embedded SDK rests on: the standalone engine and a Go
  # application embedding the compiled core serve the same YAML identically.
  # Every case runs against both stands, and a disagreement fails the job.
  lending-system:
    name: Lending system tests (engine vs Go host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Both stands sign with it and the suite mints its tokens with it, so it
      # is set once here: a role reaches the engine from a verified JWT and
      # from nothing else, and two copies of this value would drift into a
      # suite that sends no token and a stand that is right to refuse it.
      LENDING_JWT_KEY: lending-ci-jwt-key-change-me-32bytes+
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stack.sh builds both binaries from this commit, applies the platform's
      # migrations and then the example's, and serves each stand against its
      # own database.
      # Installed before the stands are raised: stack.sh uses this interpreter
      # to prepare the engine stand's metadata copy.
      - name: Install the suite
        run: |
          python3 -m venv tests-system-lending/.venv
          tests-system-lending/.venv/bin/pip install -q -r tests-system-lending/requirements.txt
      - name: Raise both stands
        run: tests-system-lending/stack.sh up
      - name: Black-box system tests
        working-directory: tests-system-lending
        env:
          LENDING_ENGINE_URL: http://127.0.0.1:8090
          LENDING_GO_URL: http://127.0.0.1:8091
        run: .venv/bin/python -m pytest -q
      - name: Stand logs
        if: failure()
        run: |
          tail -200 tests-system-lending/.stack/engine.log
          tail -200 tests-system-lending/.stack/go.log
      - name: Drop the stands
        if: always()
        run: tests-system-lending/stack.sh down

  # Gated on the full fleet on purpose: a release binary is only ever built
  # from a commit that passed conformance, and `ci_matrix_covers_backend_registry`
  # asserts that this list still contains the conformance jobs.
  #
  # It was briefly ungated to save wall clock, on the reasoning that nothing
  # consumes these binaries on a pull request. That was wrong twice over. The
  # invariant is deliberate and tested, not incidental; and the latency it was
  # trading away is much smaller than one cold-cache run suggested — with a warm
  # cache these builds take about three and five minutes, not ten and twenty-two.
  artifacts:
    name: Build artifact (${{ matrix.target.name }})
    needs: [lint, test, backend-core-gate, mixed-backend-conformance, petshop-system]
    strategy:
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: macos-aarch64
            runner: macos-latest
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin donat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: donat-${{ matrix.target.name }}
          path: target/release/donat
          if-no-files-found: error
