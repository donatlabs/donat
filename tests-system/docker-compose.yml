# The external services a Petshop stand needs: its own database and the five
# provider endpoints, answered locally. The engine itself is NOT here — the
# stack script builds and runs the binary from this working tree, so the suite
# always tests the branch rather than a published image.
#
# Ports are offset from the conformance stack so both can be up at once.

name: petshop-system

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petshop_system
    ports:
      - "15434:5432"
    healthcheck:
      # Over TCP, not the unix socket: on first init the official image runs a
      # socket-only temp server that would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d petshop_system"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage for file attachments. The engine never carries a byte: a
  # client uploads straight here with a presigned URL and reads back from the
  # same place, so the suite has to reach it exactly as a browser would.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: petshopminio
      MINIO_ROOT_PASSWORD: petshopminiosecret
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set petshop http://minio:9000 petshopminio petshopminiosecret &&
      mc mb --ignore-existing petshop/petshop-media &&
      mc anonymous set download petshop/petshop-media
      "
    restart: "no"

  # The fast stand gets providers of its own. Sharing one instance let a
  # scenario's scripted answer be claimed by another stand's durable work,
  # which is indistinguishable from the store misbehaving.
  mock-providers-fast:
    image: python:3.12-slim
    command: ["python", "/srv/providers.py"]
    environment:
      PETSHOP_PROVIDERS_CONTROL: "1"
    volumes:
      - ../examples/petshop/mock-providers:/srv:ro
    ports:
      - "8098:8099"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/')"
      interval: 2s
      timeout: 3s
      retries: 30

  mock-providers:
    image: python:3.12-slim
    command: ["python", "/srv/providers.py"]
    environment:
      # The scripted-response control plane is what lets a black-box test drive
      # declines, 5xx retries and timeouts. Never enable this outside testing.
      PETSHOP_PROVIDERS_CONTROL: "1"
    volumes:
      - ../examples/petshop/mock-providers:/srv:ro
    ports:
      - "8099:8099"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/')"
      interval: 2s
      timeout: 3s
      retries: 30
