[workspace]
resolver = "2"
members = [
    "crates/value-contract",
    "crates/connector-abi",
    "crates/connector-catalog",
    "crates/metadata",
    "crates/storage",
    "crates/rules",
    "crates/catalog",
    "crates/schema",
    "crates/ir",
    "crates/sqlgen",
    "crates/backend",
    "crates/server",
    "crates/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: Donat's tests assert response key order matches the
# GraphQL selection set, so Value must keep insertion order.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# CancellationToken and TaskTracker: one signal that stops the HTTP server and
# every background worker, and a way to wait for them.
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["ws"] }
# The two layers that bound a request: a deadline, and a panic that must become
# a response instead of a dropped connection.
tower-http = { version = "0.6", features = ["catch-panic", "timeout"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
# Every managed Postgres (RDS, Cloud SQL, Neon, Supabase) requires TLS, so the
# engine has to be able to speak it. `ring` is the provider reqwest's rustls
# already pulls in; naming it here keeps one provider in the binary.
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
deadpool-postgres = "0.14"
graphql-parser = "0.4"
insta = { version = "1", features = ["yaml"] }
base64 = "0.22"
jsonwebtoken = "9"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
tungstenite = "0.24"
postgres = "0.19"
refinery = { version = "0.8", features = ["tokio-postgres"] }
tracing = "0.1"
# `json`: a deployment that ships logs to anything other than a terminal needs
# them structured — ADR operations/005 explains why that is the engine's job.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
croner = "3"
uuid = "1"
sha2 = "0.10"
ryu-js = "=1.0.2"
