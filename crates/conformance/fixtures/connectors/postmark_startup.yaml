# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach: startup
# must name the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: postmark_present
      module: postmark
      config:
        endpoint_identity: postmark_conformance
        credential_identity: postmark_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: template.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: postmark_missing
      module: postmark
      config:
        endpoint_identity: postmark_conformance
        credential_identity: postmark_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: postmark_refused
      module: postmark
      config:
        endpoint_identity: postmark_conformance
        credential_identity: postmark_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: email.send_batch
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `postmark_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `email.send_batch` on module `postmark`: connector operation is not compiled into this binary"
  output_excludes: "connector-present-secret-sentinel"
