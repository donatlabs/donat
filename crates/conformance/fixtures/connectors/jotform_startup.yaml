# Donat-owned connector startup fixture (spec 010 §12, spec 028 §4).
#
# `metadata` withholds one instance's API key while another instance's
# resolves: startup must name only the unavailable variable. Both instances
# configure a region, because Jotform's origin is chosen from a compiled table
# of the three API URLs it publishes and a deployment names a region rather
# than a host. `refused_metadata` enables the one `DELETE` this connector
# declares: Jotform publishes no repeat statement for it and no consequence of
# a second send either, so it is inventory-only and startup must name its exact
# metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: jotform_present
      module: jotform
      config:
        endpoint_identity: jotform_conformance
        credential_identity: jotform_conformance_credential
        settings:
          region: eu
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: form.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: jotform_missing
      module: jotform
      config:
        endpoint_identity: jotform_conformance
        credential_identity: jotform_conformance_credential
        settings:
          region: us
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: jotform_refused
      module: jotform
      config:
        endpoint_identity: jotform_conformance
        credential_identity: jotform_conformance_credential
        settings:
          region: eu
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: submission.delete
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `jotform_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `submission.delete` on module `jotform`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
