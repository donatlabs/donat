# Donat-owned connector startup fixture (spec 010 §12, spec 015 §3).
#
# `metadata` withholds one instance's OAuth2 client secret while another
# instance's resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an inventory-only operation: startup must name the
# exact metadata path. `scope_metadata` enables an operation this deployment's
# declared permissions do not authorize: startup must name
# `config.oauth2.scopes`, which is `microsoft_outlook_permission_shortfall_fails_closed`
# proven against the real binary. None of the three may disclose a resolved
# value.
#
# Every instance declares `offline_access` alongside its Graph permissions,
# because Microsoft publishes that as the precondition for receiving a refresh
# token at all, and this connector family cannot serve without one.
metadata:
  version: 3
  connectors:
    - name: microsoft_outlook_present
      module: microsoft_outlook
      config:
        endpoint_identity: microsoft_outlook_conformance
        credential_identity: microsoft_outlook_conformance_credential
        oauth2:
          authorization_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
          redirect_uri: http://127.0.0.1:8765/callback
          client_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          client_secret:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          scopes:
            - offline_access
            - Mail.ReadBasic
      operations:
        - name: message.get
          capacity: &capacity
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: microsoft_outlook_missing
      module: microsoft_outlook
      config:
        endpoint_identity: microsoft_outlook_conformance
        credential_identity: microsoft_outlook_conformance_credential
        oauth2:
          authorization_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
          redirect_uri: http://127.0.0.1:8765/callback
          client_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          client_secret:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
          scopes:
            - offline_access
            - Mail.ReadBasic
      operations:
        - name: message.get
          capacity: *capacity
refused_metadata:
  version: 3
  connectors:
    - name: microsoft_outlook_refused
      module: microsoft_outlook
      config:
        endpoint_identity: microsoft_outlook_conformance
        credential_identity: microsoft_outlook_conformance_credential
        oauth2:
          authorization_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
          redirect_uri: http://127.0.0.1:8765/callback
          client_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          client_secret:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          scopes:
            - offline_access
            - Mail.ReadWrite
      operations:
        - name: message.update
          capacity: *capacity
scope_metadata:
  version: 3
  connectors:
    - name: microsoft_outlook_scoped
      module: microsoft_outlook
      config:
        endpoint_identity: microsoft_outlook_conformance
        credential_identity: microsoft_outlook_conformance_credential
        oauth2:
          authorization_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
          redirect_uri: http://127.0.0.1:8765/callback
          client_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          client_secret:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          scopes:
            - offline_access
            - Mail.ReadBasic
      operations:
        - name: message.get
          capacity: *capacity
        - name: message.delete
          capacity: *capacity
expect:
  missing_variable: "connector instance `microsoft_outlook_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `message.update` on module `microsoft_outlook`: connector operation is inventory-only and cannot be enabled by a deployment"
  scope_shortfall: "connectors.yaml[0].config.oauth2.scopes: connector operation `message.delete` on module `microsoft_outlook` is not authorized by any declared scope"
  output_excludes: "connector-present-secret-sentinel"
