# Donat-owned connector startup fixture (spec 010 §12, spec 028 §3 and §4).
#
# `metadata` withholds one instance's API key while another instance's
# resolves: startup must name only the unavailable variable. Both instances
# configure the account's numeric User ID, because it is Acuity's HTTP Basic
# *username* and therefore declaration material rather than a secret — it names
# an account, it is compiled into the auth plan, and no request may choose it.
# `refused_metadata` enables the cancel: it is a `PUT` against a fixed identity,
# which is the method half of spec 010 §7's `NaturalMethod` and not its evidence
# half, and Acuity publishes no repeat statement — so it is inventory-only and
# startup must name its exact metadata path. Neither may disclose the key.
metadata:
  version: 3
  connectors:
    - name: acuity_present
      module: acuity
      config:
        endpoint_identity: acuity_conformance
        credential_identity: acuity_conformance_credential
        settings:
          user_id: "11145481"
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: appointment.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: acuity_missing
      module: acuity
      config:
        endpoint_identity: acuity_conformance
        credential_identity: acuity_conformance_credential
        settings:
          user_id: "22290962"
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: acuity_refused
      module: acuity
      config:
        endpoint_identity: acuity_conformance
        credential_identity: acuity_conformance_credential
        settings:
          user_id: "11145481"
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: appointment.cancel
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `acuity_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `appointment.cancel` on module `acuity`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
