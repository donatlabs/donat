# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach: startup
# must name the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: aws_s3_present
      module: aws_s3
      config:
        endpoint_identity: aws_s3_conformance
        credential_identity: aws_s3_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          bucket: donat-conformance-bucket
          bucket_versioning: unversioned
      operations:
        - name: object.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: aws_s3_missing
      module: aws_s3
      config:
        endpoint_identity: aws_s3_conformance
        credential_identity: aws_s3_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          region: eu-west-1
          bucket: donat-conformance-bucket
          bucket_versioning: unversioned
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: aws_s3_refused
      module: aws_s3
      config:
        endpoint_identity: aws_s3_conformance
        credential_identity: aws_s3_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          bucket: donat-conformance-bucket
          bucket_versioning: versioned
      operations:
        - name: object.delete
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `aws_s3_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `object.delete` on module `aws_s3`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
