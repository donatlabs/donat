# Donat-owned connector startup fixture (spec 010 §12, spec 028 §3).
#
# Eventbrite's credential is one private token sent as `Authorization: Bearer`,
# and its organization is a path segment of the event collection and the event
# create. The organization is *not* a secret — Eventbrite prints it in its own
# organizer URLs — so it is `config.settings` material with a grammar of its
# own, and a mistyped one is a startup refusal here rather than an event created
# in somebody else's organization.
#
# `metadata` withholds one instance's token while another instance's resolves.
# `refused_metadata` enables the partial update Eventbrite publishes over a
# `POST` and says nothing about repeating. `account_metadata` names an
# organization id Eventbrite's own grammar does not admit.
metadata:
  version: 3
  connectors:
    - name: eventbrite_present
      module: eventbrite
      config:
        endpoint_identity: eventbrite_conformance
        credential_identity: eventbrite_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          organization_id: "123456789012"
      operations:
        - name: event.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: eventbrite_missing
      module: eventbrite
      config:
        endpoint_identity: eventbrite_conformance
        credential_identity: eventbrite_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          organization_id: "123456789012"
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: eventbrite_refused
      module: eventbrite
      config:
        endpoint_identity: eventbrite_conformance
        credential_identity: eventbrite_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          organization_id: "123456789012"
      operations:
        - name: event.update
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
account_metadata:
  version: 3
  connectors:
    - name: eventbrite_account
      module: eventbrite
      config:
        endpoint_identity: eventbrite_conformance
        credential_identity: eventbrite_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          organization_id: 123456789012/../000000000000
      operations:
        - name: event.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `eventbrite_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `event.update` on module `eventbrite`: connector operation is inventory-only and cannot be enabled by a deployment"
  module_refusal: "connectors.yaml[0].config.settings.organization_id: the `eventbrite` connector refuses this value"
  output_excludes: "connector-present-secret-sentinel"
