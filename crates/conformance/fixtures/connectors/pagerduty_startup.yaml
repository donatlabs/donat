# Donat-owned connector startup fixture (spec 010 §12, spec 027 §3).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable. The
# `from_email` is the account user PagerDuty attributes every write to, and it
# is compiled into the declaration rather than left as an input.
# `refused_metadata` enables an operation this deployment may not reach:
# PagerDuty publishes `incident.update` as "Acknowledge, resolve, escalate or
# reassign an incident" — a partial state change with no repeat statement.
metadata:
  version: 3
  connectors:
    - name: pagerduty_present
      module: pagerduty
      config:
        endpoint_identity: pagerduty_conformance
        credential_identity: pagerduty_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          from_email: oncall@donat-conformance.example.test
      operations:
        - name: incident.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: pagerduty_missing
      module: pagerduty
      config:
        endpoint_identity: pagerduty_conformance
        credential_identity: pagerduty_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          from_email: oncall@donat-conformance.example.test
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: pagerduty_refused
      module: pagerduty
      config:
        endpoint_identity: pagerduty_conformance
        credential_identity: pagerduty_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          from_email: oncall@donat-conformance.example.test
      operations:
        - name: incident.update
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `pagerduty_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `incident.update` on module `pagerduty`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
