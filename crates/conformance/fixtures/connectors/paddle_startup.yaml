# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables the refund — `adjustment.create`, which Paddle
# publishes no idempotency key for and which spec 026 §3 refuses to admit
# through the at-most-once opt-in — and startup must name the exact metadata
# path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: paddle_present
      module: paddle
      config:
        endpoint_identity: paddle_conformance
        credential_identity: paddle_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: transaction.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: paddle_missing
      module: paddle
      config:
        endpoint_identity: paddle_conformance
        credential_identity: paddle_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: paddle_refused
      module: paddle
      config:
        endpoint_identity: paddle_conformance
        credential_identity: paddle_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: adjustment.create
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `paddle_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `adjustment.create` on module `paddle`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
