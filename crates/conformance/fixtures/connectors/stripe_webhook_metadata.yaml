metadata:
  version: 3
  sources: []
  connectors:
    - name: payments
      module: stripe
      config:
        endpoint_identity: stripe_conformance_2026_07
        credential_identity: stripe_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_STRIPE_API_KEY
        webhook_secret:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_STRIPE_WEBHOOK_SECRET
        api_version: "2026-07-27"
      operations:
        - name: checkout.create_session
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
