# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach — the
# string `idempot` occurs once in Intercom's whole published description and on
# another endpoint, so `contact.create` is inventory-only — and startup must name
# the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: intercom_present
      module: intercom
      config:
        endpoint_identity: intercom_conformance
        credential_identity: intercom_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: contact.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: intercom_missing
      module: intercom
      config:
        endpoint_identity: intercom_conformance
        credential_identity: intercom_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: intercom_refused
      module: intercom
      config:
        endpoint_identity: intercom_conformance
        credential_identity: intercom_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
      operations:
        - name: company.create_or_update
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `intercom_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `company.create_or_update` on module `intercom`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
