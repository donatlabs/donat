# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach — Freshdesk publishes nothing about what a `PUT` does beyond "PUT | Update an object", so `ticket.update` is inventory-only. The `domain` fills the templated host.
# Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: freshdesk_present
      module: freshdesk
      config:
        endpoint_identity: freshdesk_conformance
        credential_identity: freshdesk_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          domain: donat-conformance
      operations:
        - name: ticket.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: freshdesk_missing
      module: freshdesk
      config:
        endpoint_identity: freshdesk_conformance
        credential_identity: freshdesk_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          domain: donat-conformance
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: freshdesk_refused
      module: freshdesk
      config:
        endpoint_identity: freshdesk_conformance
        credential_identity: freshdesk_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          domain: donat-conformance
      operations:
        - name: ticket.update
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `freshdesk_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `ticket.update` on module `freshdesk`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
