# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach: startup
# must name the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: airtable_present
      module: airtable
      config:
        endpoint_identity: airtable_conformance
        credential_identity: airtable_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          base_id: appConformanceBase
      operations:
        - name: record.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: airtable_missing
      module: airtable
      config:
        endpoint_identity: airtable_conformance
        credential_identity: airtable_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          base_id: appConformanceBase
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: airtable_refused
      module: airtable
      config:
        endpoint_identity: airtable_conformance
        credential_identity: airtable_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          base_id: appConformanceBase
      operations:
        - name: record.update_patch
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `airtable_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `record.update_patch` on module `airtable`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
