# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach: startup
# must name the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: aws_ses_present
      module: aws_ses
      config:
        endpoint_identity: aws_ses_conformance
        credential_identity: aws_ses_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          from_email_address: notifications@example.test
      operations:
        - name: template.list
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: aws_ses_missing
      module: aws_ses
      config:
        endpoint_identity: aws_ses_conformance
        credential_identity: aws_ses_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          region: eu-west-1
          from_email_address: notifications@example.test
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: aws_ses_refused
      module: aws_ses
      config:
        endpoint_identity: aws_ses_conformance
        credential_identity: aws_ses_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          from_email_address: notifications@example.test
      operations:
        - name: email.send_bulk
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `aws_ses_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `email.send_bulk` on module `aws_ses`: connector operation is not compiled into this binary"
  output_excludes: "connector-present-secret-sentinel"
