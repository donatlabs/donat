# Donat-owned connector startup fixture (spec 010 §12: every connector adds a
# native conformance fixture proving startup validation and redaction).
#
# `metadata` withholds one required environment value while another instance's
# secret resolves: startup must name only the unavailable variable.
# `refused_metadata` enables an operation this deployment may not reach: startup
# must name the exact metadata path. Neither may disclose a resolved value.
metadata:
  version: 3
  connectors:
    - name: aws_sqs_present
      module: aws_sqs
      config:
        endpoint_identity: aws_sqs_conformance
        credential_identity: aws_sqs_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          account_id: '123456789012'
          queue_name: donat-conformance.fifo
          queue_type: fifo
      operations:
        - name: message.send
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: aws_sqs_missing
      module: aws_sqs
      config:
        endpoint_identity: aws_sqs_conformance
        credential_identity: aws_sqs_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          region: eu-west-1
          account_id: '123456789012'
          queue_name: donat-conformance.fifo
          queue_type: fifo
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: aws_sqs_refused
      module: aws_sqs
      config:
        endpoint_identity: aws_sqs_conformance
        credential_identity: aws_sqs_conformance_credential
        secrets:
          access_key_id:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
          secret_access_key:
            value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          region: eu-west-1
          account_id: '123456789012'
          queue_name: donat-conformance
          queue_type: standard
      operations:
        - name: message.delete
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `aws_sqs_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `message.delete` on module `aws_sqs`: connector operation is inventory-only and cannot be enabled by a deployment"
  output_excludes: "connector-present-secret-sentinel"
