# Donat-owned connector startup fixture (spec 010 §12, spec 028 §3).
#
# BambooHR publishes exactly one credential wire form and the secret is the HTTP
# Basic *username*: "Use the secret key as the username and any random string
# for the password", with the worked example `curl -i -u "{API Key}:x"`. The
# password is therefore a compile-time constant of the module rather than
# configuration — a deployment that could choose it would be choosing a value
# the provider ignores — and the instance's whole credential is one
# `config.secret_key`.
#
# `metadata` withholds one instance's key while another instance's resolves:
# startup must name only the unavailable variable. `refused_metadata` enables
# the partial update BambooHR publishes over a `POST` — a method the effect gate
# does not admit for `NaturalMethod`, and an operation whose second send the
# provider never described, so it is not at-most-once either.
# `account_metadata` names a company subdomain that is a whole host rather than
# one label, which is a startup refusal rather than a request this connector
# would have sent to another authority.
metadata:
  version: 3
  connectors:
    - name: bamboohr_present
      module: bamboohr
      config:
        endpoint_identity: bamboohr_conformance
        credential_identity: bamboohr_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          company_domain: acme
      operations:
        - name: employee.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
    - name: bamboohr_missing
      module: bamboohr
      config:
        endpoint_identity: bamboohr_conformance
        credential_identity: bamboohr_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY
        settings:
          company_domain: acme
      operations: []
refused_metadata:
  version: 3
  connectors:
    - name: bamboohr_refused
      module: bamboohr
      config:
        endpoint_identity: bamboohr_conformance
        credential_identity: bamboohr_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          company_domain: acme
      operations:
        - name: employee.update
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
account_metadata:
  version: 3
  connectors:
    - name: bamboohr_account
      module: bamboohr
      config:
        endpoint_identity: bamboohr_conformance
        credential_identity: bamboohr_conformance_credential
        secret_key:
          value_from_env: DONAT_CONNECTOR_CONFORMANCE_PRESENT_SECRET
        settings:
          company_domain: acme.bamboohr.com
      operations:
        - name: employee.get
          capacity:
            max_in_flight: 1
            rate_limit:
              permits: 1
              per: 1s
              burst: 1
expect:
  missing_variable: "connector instance `bamboohr_missing` requires environment variable `DONAT_CONNECTOR_CONFORMANCE_MISSING_API_KEY`"
  refused_operation: "connectors.yaml[0].operations[0].name: connector operation `employee.update` on module `bamboohr`: connector operation is inventory-only and cannot be enabled by a deployment"
  module_refusal: "connectors.yaml[0].config.settings.company_domain: the `bamboohr` connector refuses this value"
  output_excludes: "connector-present-secret-sentinel"
