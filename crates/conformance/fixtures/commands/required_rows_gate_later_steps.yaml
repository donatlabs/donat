- description: No later command write reached its trigger after any required-row rejection.
  url: /v1/graphql
  status: 200
  headers:
    X-Donat-Role: customer
  query:
    query: |
      query LaterWritesAfterRequiredRowRejections {
        command_later_writes {
          id
        }
      }
  response:
    data:
      command_later_writes: []
