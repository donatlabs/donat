# The regression this pins: session resolution must precede routing for a
# request that matches no endpoint. Were 404 returned first, a role-less
# request could enumerate which routes exist; the role error must win.
description: A role-less request to an unknown path gets the role error, not 404.
url: /api/rest/does/not/exist
method: GET
status: 200
response:
  errors:
    - extensions:
        path: "$"
        code: access-denied
      message: x-donat-role header is required (this engine has no admin role)
