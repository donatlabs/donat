# The regression this pins: session resolution must precede routing for a
# request that matches no endpoint. Were 404 returned first, an
# unauthenticated request could enumerate which routes exist; the
# authentication failure must win.
description: An unauthenticated request to an unknown path is refused, not 404'd.
url: /api/rest/does/not/exist
method: GET
status: 401
response:
  errors:
    - extensions:
        path: "$"
        code: access-denied
      message: Authentication hook unauthorized this request
