description: >-
  A response transform rewrites the handler's answer before it is shaped, so
  an output type whose fields the handler never heard of is still satisfied.
url: /v1/graphql
status: 200
response:
  data:
    mirror_transformed_output:
      foo: some-id
      bar: Alice
query:
  variables:
    id: some-id
    name: Alice
  query: |
    mutation ($id: ID, $name: String) {
      mirror_transformed_output(arg: {id: $id, name: $name}){
        foo
        bar
      }
    }
