[package]
name = "donat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server exposing the Donat v2 API surface (/v1/graphql, /healthz, /v1/version)"

[lib]
name = "donat_server"
path = "src/lib.rs"

[[bin]]
name = "donat"
path = "src/main.rs"

[dependencies]
donat-action = { path = "../action" }
donat-metadata = { path = "../metadata" }
donat-rules = { path = "../rules" }
donat-catalog = { path = "../catalog" }
donat-schema = { path = "../schema" }
donat-processes = { path = "../processes" }
donat-ir = { path = "../ir" }
donat-sqlgen = { path = "../sqlgen" }
donat-backend = { path = "../backend" }
donat-connector-abi = { path = "../connector-abi" }
donat-connector-catalog = { path = "../connector-catalog" }
donat-connectors = { path = "../connectors" }
graphql-parser = { workspace = true }
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
jsonwebtoken = { workspace = true }
donat-kriti = { path = "../kriti" }
reqwest = { workspace = true }
futures-util = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
refinery = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
percent-encoding = "2"
tower-http = { workspace = true }
tokio-util = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
donat-storage = { path = "../storage" }
sha2 = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
insta = { workspace = true }
# The SDK's local provider stub: an integration test asserts the exact request
# that reached the wire, including the applied credential header. The feature is
# dev-only, so the stub's HTTP server stays out of the `donat` binary.
donat-connectors = { path = "../connectors", features = ["testing"] }
