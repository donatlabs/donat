# Read one or more items by id. monday: "Returns an array containing metadata
# about one or a collection of specific items."
query ItemGet($ids: [ID!]) {
  items(ids: $ids) {
    id
    name
    state
    url
    created_at
    updated_at
    board {
      id
      name
    }
    group {
      id
      title
    }
    column_values {
      id
      text
      value
      type
    }
  }
}
