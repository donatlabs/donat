[package]
name = "donat-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Planner: GraphQL operation + metadata + catalog -> IR, with permissions applied"

[dependencies]
donat-metadata = { path = "../metadata" }
donat-catalog-types = { path = "../catalog-types" }
donat-rules = { path = "../rules" }
donat-ir = { path = "../ir" }
donat-storage = { path = "../storage" }
donat-sqlgen = { path = "../sqlgen" }
donat-backend = { path = "../backend" }
graphql-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
# `tracing` is used only for diagnostics in the rule-catalog adapter; it is
# a facade with a no-op default subscriber, so it compiles to wasm cleanly.
tracing = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
