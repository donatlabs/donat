# What a sweep records is what it claimed, and nothing that happens to look the
# same.
#
# Two sweeps can hold `sending` rows for one recipient at once, because the
# second claimed notifications that arrived after the first's claim. This is
# why the record is scoped by `claim_id` and not by status: a record scoped by
# status alone would stamp the other sweep's messages with this sweep's id.
vars:
  alice: 11111111-1111-4111-8111-111111111111
  claim_a: 11110000-0000-4000-8000-00000000000a
  claim_b: 11110000-0000-4000-8000-00000000000b

tests:
  - name: a sweep records only what it claimed
    steps:
      - sql: insert into public.app_user (id, email) values ('${alice}', 'alice@example.test')
      - sql: |
          insert into notification.dispatch (workflow, recipient_id, title, body, digest)
          values ('order_shipped', '${alice}', 'one', 'it shipped', true)
          returning id
        capture: { first: id }
      - sql: |
          insert into notification.delivery
            (dispatch_id, recipient_id, workflow, channel, status)
          values ('${first}', '${alice}', 'order_shipped', 'email', 'deferred')
      - as: { role: notification_worker, user: "${alice}" }
      - graphql: |
          mutation { notification_claim_digest(recipient_id: "${alice}",
                       workflow: "order_shipped", claim_id: "${claim_a}") { pending } }
        expect: { data: { notification_claim_digest: { pending: 1 } } }
      # A second notification arrives and a second sweep claims it.
      - sql: |
          insert into notification.dispatch (workflow, recipient_id, title, body, digest)
          values ('order_shipped', '${alice}', 'two', 'it shipped', true)
          returning id
        capture: { late: id }
      - sql: |
          insert into notification.delivery
            (dispatch_id, recipient_id, workflow, channel, status)
          values ('${late}', '${alice}', 'order_shipped', 'email', 'deferred')
      - graphql: |
          mutation { notification_claim_digest(recipient_id: "${alice}",
                       workflow: "order_shipped", claim_id: "${claim_b}") { pending } }
        expect: { data: { notification_claim_digest: { pending: 1 } } }
      # The first sweep records. Only its own row may move.
      - graphql: |
          mutation { notification_record_digest_sent(claim_id: "${claim_a}",
                       provider_message_id: "message-from-sweep-a") { claim_id } }
      - sql: |
          select status, provider_message_id from notification.delivery
          where dispatch_id = '${first}'
        expect: [{ status: sent, provider_message_id: message-from-sweep-a }]
      # The other sweep's row is untouched, and carries no message it was not in.
      - sql: |
          select status, provider_message_id from notification.delivery
          where dispatch_id = '${late}'
        expect: [{ status: sending, provider_message_id: null }]
