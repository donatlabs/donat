# The claim is what makes two schedulers harmless.
#
# It moves a group's rows `deferred` → `sending` under its own id, in one
# statement, and a second claim finds nothing to move. It is an update rather
# than a read for exactly that reason: two readers of the same unclaimed rows
# would both send.
vars:
  alice: 11111111-1111-4111-8111-111111111111

tests:
  - name: a claimed digest group cannot be claimed twice
    steps:
      - sql: insert into public.app_user (id, email) values ('${alice}', 'alice@example.test')
      # The claim's subject is the delivery log, so the log is what this seeds:
      # two notifications for one group, both waiting for a sweep.
      - sql: |
          insert into notification.dispatch (workflow, recipient_id, title, body, digest)
          select 'order_shipped', '${alice}', 'one', 'it shipped', true
          from generate_series(1, 2)
      - sql: |
          insert into notification.delivery
            (dispatch_id, recipient_id, workflow, channel, status)
          select id, recipient_id, workflow, 'email', 'deferred' from notification.dispatch
      - as: { role: notification_worker, user: "${alice}" }
      - graphql: |
          mutation { notification_claim_digest(recipient_id: "${alice}",
                       workflow: "order_shipped",
                       claim_id: "11110000-0000-4000-8000-000000000001") { pending } }
        # The claim takes the whole group, which is what makes it one message.
        expect: { data: { notification_claim_digest: { pending: 2 } } }
      # A claimed group refuses a second claim rather than sending a digest of
      # zero: `require_each` on rows that are no longer `deferred` is a refusal.
      - graphql: |
          mutation { notification_claim_digest(recipient_id: "${alice}",
                       workflow: "order_shipped",
                       claim_id: "11110000-0000-4000-8000-000000000002") { pending } }
        expect: { errors: "@present" }
