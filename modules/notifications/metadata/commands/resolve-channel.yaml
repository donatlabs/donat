# What the Process needs to know before it delivers on a channel: what is being
# sent, where it would go, and whether this recipient has opted out of that
# channel for that workflow. It writes nothing.
name: notification_resolve_channel
source: default
permissions:
  - role: notification_worker
arguments:
  - name: dispatch_id
    type: uuid!
  - name: channel
    type: string!
steps:
  - name: dispatch
    select_one:
      table: { schema: notification, name: dispatch }
      by:
        id: { arg: dispatch_id }
      returning: [id, workflow, recipient_id, title, body, url, digest, payload]
      require_found: true
  # The address comes from the application's own binding, read at send time
  # rather than copied at trigger time — an address that changed between the
  # two is the current one.
  - name: recipient
    select_one:
      table: { schema: notification, name: recipient }
      by:
        id: { step: dispatch, column: recipient_id }
      returning: [id, locale]
      require_found: true
  # Per channel, and read by the channel's own name — which is the whole reason
  # a deployment can add one. `require_found: false`: a recipient with no
  # address on this channel is a fact the flow routes on, not a failure.
  - name: address
    select_one:
      table: { schema: notification, name: recipient_address }
      by:
        recipient_id: { step: dispatch, column: recipient_id }
        channel: { arg: channel }
      returning: [recipient_id, channel, address, verified]
      require_found: false
  # At most one row: (recipient, workflow, channel) is the preference key, and
  # only a row that says `enabled: false` is selected at all.
  - name: opt_out
    select_many:
      table: { schema: notification, name: preference }
      by:
        recipient_id: { step: dispatch, column: recipient_id }
        workflow: { step: dispatch, column: workflow }
        channel: { arg: channel }
        enabled: { literal: false }
      order_by: [recipient_id]
      returning: [enabled]
      maximum_rows: 1
  - name: counted
    aggregate:
      from: { step: opt_out }
      values:
        opted_out: { count: {} }
result:
  dispatch_id: { step: dispatch, column: id }
  workflow: { step: dispatch, column: workflow }
  recipient_id: { step: dispatch, column: recipient_id }
  title: { step: dispatch, column: title }
  body: { step: dispatch, column: body }
  payload: { step: dispatch, column: payload }
  locale: { step: recipient, column: locale }
  digest: { step: dispatch, column: digest }
  address: { step: address, column: address }
  opted_out: { step: counted, column: opted_out }
