# What a scheduler reads to know what is owed. It is a view over the delivery
# log, and the only role that may read it is the one that runs the sweep: the
# rows name recipients and count their unsent mail, which is nobody else's
# business — least of all a recipient's.
vars:
  alice: 11111111-1111-4111-8111-111111111111
  request: dddddddd-4444-4444-8444-444444444444

tests:
  - name: the scheduler reads what is owed and a recipient cannot
    steps:
      - sql: insert into public.app_user (id, email) values ('${alice}', 'alice@example.test')
      - as: { role: notification_sender, user: "${alice}" }
      - graphql: |
          mutation { notify_digested(workflow: "order_shipped", recipient_id: "${alice}",
                                     title: "your order shipped", body: "it shipped",
                                     request_id: "${request}") { dispatch_id } }
        capture: { dispatch: /data/notify_digested/dispatch_id }
      - await:
          sql: |
            select status from notification.delivery
            where dispatch_id = '${dispatch}' and channel = 'email'
          expect: [{ status: deferred }]
      - as: { role: notification_scheduler, user: "${alice}" }
      - graphql: 'query { notification_pending_digest { recipient_id workflow pending } }'
        expect:
          data:
            notification_pending_digest:
              - { recipient_id: "${alice}", workflow: order_shipped, pending: 1 }
      # The recipient the rows are about has no read on them at all: the field
      # is not in their schema, so this is a validation error and not an empty
      # list.
      - as: { role: notification_user, user: "${alice}" }
      - graphql: 'query { notification_pending_digest { recipient_id } }'
        expect: { errors: "@present" }
