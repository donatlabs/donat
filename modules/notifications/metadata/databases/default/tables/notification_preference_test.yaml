# Opting out. The table is written by the recipient themselves, which is the
# whole reason it has a preset: the row's owner is the session, never the
# request. These cases prove that from both sides — the value the caller may
# not supply, and the row the other recipient cannot see.
vars:
  alice: 11111111-1111-4111-8111-111111111111
  bob: 22222222-2222-4222-8222-222222222222

tests:
  - name: a preference belongs to whoever wrote it
    steps:
      - as: { role: notification_user, user: "${alice}" }
      - graphql: |
          mutation { insert_notification_preference(objects: [
                       {workflow: "order_shipped", channel: "email", enabled: false}])
                     { affected_rows } }
        expect: { data: { insert_notification_preference: { affected_rows: 1 } } }
      - graphql: 'query { notification_preference { workflow channel enabled } }'
        expect:
          data:
            notification_preference:
              - { workflow: order_shipped, channel: email, enabled: false }
      - as: { role: notification_user, user: "${bob}" }
      # Bob has opted out of nothing, and cannot see that Alice has.
      - graphql: 'query { notification_preference { workflow channel enabled } }'
        expect: { data: { notification_preference: [] } }

  - name: a recipient id is a preset and not an argument
    steps:
      - as: { role: notification_user, user: "${alice}" }
      # The column is not in the role's insert list, so it is not in the input
      # type at all: naming it is a validation error rather than a value the
      # preset quietly overwrites.
      - graphql: |
          mutation { insert_notification_preference(objects: [
                       {recipient_id: "${bob}", workflow: "order_shipped",
                        channel: "email", enabled: false}])
                     { affected_rows } }
        expect: { errors: "@present" }

  - name: opting out twice is the documented mutation
    steps:
      # `(recipient_id, workflow, channel)` is the key, so the README documents
      # opt-out as an upsert. This is that exact mutation, run three times
      # around an opt-back-in — the sequence a plain insert would break on.
      - as: { role: notification_user, user: "${alice}" }
      - for: [false, true, false]
        do:
          - graphql: |
              mutation { insert_notification_preference(
                           objects: [{workflow: "order_shipped", channel: "email",
                                      enabled: ${item}}],
                           on_conflict: {constraint: preference_pkey,
                                         update_columns: [enabled]})
                         { affected_rows } }
            expect: { data: { insert_notification_preference: { affected_rows: 1 } } }
      - graphql: 'query { notification_preference { workflow channel enabled } }'
        expect:
          data:
            notification_preference:
              - { workflow: order_shipped, channel: email, enabled: false }
