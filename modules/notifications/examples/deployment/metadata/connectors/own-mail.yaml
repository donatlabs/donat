# This deployment's relay.
#
# Derived from the module's shipped file the way an adopter derives theirs: keep
# the instance name and the two operation names the flows rely on, and change
# what is yours — the path, the field names on the wire, the response pointers,
# the credential identity. Everything else below is the module's, because
# bounds, retries and redaction are about the *contract*, not about the vendor.
#
# The one rule that is not obvious: a body must consume *every* declared input.
# An input the body never mentions is refused as `connector operation input
# contains an undeclared value`, with `class=Invariant`, before the request
# leaves — so the relay sees nothing and the journal says only that an activity
# failed. Renaming the keys is allowed; dropping one is not.
name: notification_mail
module: http
config:
  endpoint_identity: acme_mail_v3
  credential_identity: acme_mail
  base_url: { value_from_env: NOTIFICATION_MAIL_BASE_URL }
  headers:
    - name: Authorization
      value_from_env: NOTIFICATION_MAIL_TOKEN
operations:
  - name: send_email
    version: v1
    method: POST
    path: /api/v3/messages/send
    # `subject` and `body` are the caller's own words and always present;
    # `workflow`, `locale` and `payload` are what let the relay render a
    # template instead of forwarding them. A relay that templates nothing can
    # ignore the last three and still work.
    input_contract:
      message_key: string!
      recipient: string!
      subject: string!
      body: string!
      workflow: string!
      locale: string
      payload: NotificationPayload
    body:
      IdempotencyKey: { input: message_key }
      To: { input: recipient }
      Subject: { input: subject }
      TextBody: { input: body }
      Tag: { input: workflow }
      Language: { input: locale }
      Data: { input: payload }
    success_statuses: [200, 201, 202]
    response:
      provider_message_id: { json_pointer: /Id, type: string!, max_bytes: 256 }
      normalized_status: { json_pointer: /Result, type: string!, max_bytes: 64 }
    effect:
      provider_idempotent:
        side_effect_steps:
          - step: request
            fixed_binding: { header: Idempotency-Key }
            scope: acme-mail-v3
            minimum_retention_ms: 604800000
            clock_safety_margin_ms: 300000
            evidence:
              source_record_id: source.donat.notification-mail-contract.v1
              fact_ids:
                - fact.notification-mail.fixed-idempotency-header
                - fact.notification-mail.retention-604800000
    bounds:
      deadline_ms: 5000
      maximum_calls: 1
      maximum_pages: 1
      maximum_items: 1
      maximum_aggregate_request_bytes: 65536
      maximum_aggregate_response_bytes: 8192
      maximum_output_canonical_bytes: 8192
      maximum_redirects: 0
      maximum_json_depth: 8
      maximum_json_nodes: 128
    error_map:
      rules:
        - { statuses: [401, 403], class: authentication, code: mail_authentication }
        - { statuses: [408], class: timeout, code: mail_timeout }
        - { statuses: [429], class: http_429, code: mail_rate_limited }
        - { statuses: [500, 502, 503, 504], class: http_5xx, code: mail_unavailable }
        - { statuses: [400, 404, 409, 422], class: validation, code: mail_rejected }
      fallback: { class: permanent, code: mail_provider_error }
    # The connector's own ceiling. The activity that calls it narrows both —
    # `start_to_close: 5s` and `max_attempts: 3` — and the narrower of the two
    # is what runs; these are the widest this operation may ever be given.
    timeout: 5s
    retry:
      maximum_attempts: 4
      backoff: 250ms
      retry_on: [transport, timeout, http_429, http_5xx]
    capacity:
      max_in_flight: 16
      rate_limit: { permits: 60, per: 1m, burst: 16 }
      serialize_by: { input: message_key }
    idempotency: { header: Idempotency-Key }
    # The recipient's address and the message itself never reach a log.
    redaction:
      request_headers: [Authorization]
      request_body: [recipient, subject, body, payload]
      response_body: [provider_message_id]

  # The digest's own send. It carries a count rather than a composed
  # sentence, for the same reason the single message carries a body rather
  # than rendered HTML: the engine cannot render one yet (`plans/004-*`).
  - name: send_digest
    version: v1
    method: POST
    path: /api/v3/messages/digest
    # `recipient` is nullable here and nowhere else. It reaches this send as
    # a fan-out item, and a `for_each` item has no `require_non_null` the way
    # an input or a state reference does — so the guarantee that it is present
    # lives in the flow (`route_address` refuses to defer a recipient with no
    # address) rather than in the type. See `plans/005-*`.
    input_contract:
      message_key: string!
      recipient: string
      workflow: string!
      locale: string
      pending: bigint!
    body:
      IdempotencyKey: { input: message_key }
      To: { input: recipient }
      Tag: { input: workflow }
      Language: { input: locale }
      Count: { input: pending }
    success_statuses: [200, 201, 202]
    response:
      provider_message_id: { json_pointer: /Id, type: string!, max_bytes: 256 }
      normalized_status: { json_pointer: /Result, type: string!, max_bytes: 64 }
    effect:
      provider_idempotent:
        side_effect_steps:
          - step: request
            fixed_binding: { header: Idempotency-Key }
            scope: donat-notification-digest-v1
            minimum_retention_ms: 604800000
            clock_safety_margin_ms: 300000
            evidence:
              source_record_id: source.donat.notification-mail-contract.v1
              fact_ids:
                - fact.notification-mail.fixed-idempotency-header
                - fact.notification-mail.retention-604800000
    bounds:
      deadline_ms: 5000
      maximum_calls: 1
      maximum_pages: 1
      maximum_items: 1
      maximum_aggregate_request_bytes: 16384
      maximum_aggregate_response_bytes: 8192
      maximum_output_canonical_bytes: 8192
      maximum_redirects: 0
      maximum_json_depth: 8
      maximum_json_nodes: 128
    error_map:
      rules:
        - { statuses: [401, 403], class: authentication, code: mail_authentication }
        - { statuses: [408], class: timeout, code: mail_timeout }
        - { statuses: [429], class: http_429, code: mail_rate_limited }
        - { statuses: [500, 502, 503, 504], class: http_5xx, code: mail_unavailable }
        - { statuses: [400, 404, 409, 422], class: validation, code: mail_rejected }
      fallback: { class: permanent, code: mail_provider_error }
    # The connector's own ceiling. The activity that calls it narrows both —
    # `start_to_close: 5s` and `max_attempts: 3` — and the narrower of the two
    # is what runs; these are the widest this operation may ever be given.
    timeout: 5s
    retry:
      maximum_attempts: 4
      backoff: 250ms
      retry_on: [transport, timeout, http_429, http_5xx]
    capacity:
      max_in_flight: 16
      rate_limit: { permits: 60, per: 1m, burst: 16 }
      serialize_by: { input: message_key }
    idempotency: { header: Idempotency-Key }
    redaction:
      request_headers: [Authorization]
      request_body: [recipient]
      response_body: [provider_message_id]
