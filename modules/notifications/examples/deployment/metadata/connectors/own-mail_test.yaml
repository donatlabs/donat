# The swap point is one file, and this is the proof.
#
# The module's flows and commands are included here unchanged; only the
# connector instance they name is this deployment's. If the seam were not real —
# if a flow named a path, a field name or a response shape anywhere — this case
# would fail rather than the notification arriving.
vars:
  alice: 11111111-1111-4111-8111-111111111111
  request: 44444444-4444-4444-8444-444444444444

tests:
  - name: a deployment can bring its own sender
    steps:
      - providers:
          /api/v3/messages/send: { Id: own-relay-7, Result: queued }
      - sql: insert into public.app_user (id, email) values ('${alice}', 'alice@example.test')
      - as: { role: notification_sender, user: "${alice}" }
      - graphql: |
          mutation { notify(workflow: "order_shipped", recipient_id: "${alice}",
                            title: "your order shipped", body: "it shipped",
                            url: "/orders/1", request_id: "${request}") { dispatch_id } }
        capture: { dispatch: /data/notify/dispatch_id }
      # The module records a send it made through someone else's provider, and
      # the id it stores is the one that provider returned.
      - await:
          sql: |
            select status, provider_message_id from notification.delivery
            where dispatch_id = '${dispatch}' and channel = 'email'
          expect: [{ status: sent, provider_message_id: own-relay-7 }]
      - calls:
          path: /api/v3/messages/send
          count: 1
          # The wire shape is the deployment's, not the module's.
          body:
            To: alice@example.test
            Subject: your order shipped
            TextBody: it shipped
            Tag: order_shipped
          headers: { Idempotency-Key: "@present" }
