version: "3.9"

# Standalone petshop demo: postgres → one-shot `donat migrate` → the Go app.
#
#   docker compose up
#
# The project's deploy model: schema (and the demo seed) is applied out-of-band
# by one-shot `donat migrate` runs using the prebuilt engine image; the Go app
# never runs DDL — it only serves GraphQL and fires the in-process event hooks.
#
# Two migrate services. The platform's own catalog is mounted from the
# repository's top-level `migrations/` — the image carries the binary and
# nothing else — so the helper functions the error decoder pins cannot drift
# from a stale local copy.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petshop_golang
    ports:
      - "5432:5432"
    healthcheck:
      # Check over TCP, not the unix socket: on first init the official image
      # runs a socket-only temp server, so a socket pg_isready reports healthy
      # before the real TCP listener is up — and the one-shot migrate does not
      # retry.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d petshop_golang"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: the platform's own deploy-time catalog, mounted from the
  # repository so there is exactly one copy of it anywhere.
  migrate-platform:
    image: ghcr.io/donatlabs/donat:${ENGINE_TAG:-latest}
    command: ["migrate", "--migrations-dir", "/migrations"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@db:5432/petshop_golang
    volumes:
      - ../../migrations:/migrations:ro
    restart: "no"

  # One-shot: the petshop DDL and demo seed, then exit.
  migrate-domain:
    image: ghcr.io/donatlabs/donat:${ENGINE_TAG:-latest}
    command: ["migrate", "--migrations-dir", "/migrations"]
    depends_on:
      migrate-platform:
        condition: service_completed_successfully
    environment:
      DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@db:5432/petshop_golang
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"

  # One-shot: compile the metadata directory and the live catalog into the
  # snapshot the app serves, then exit. This is a build output, not source —
  # producing it needs the migrated database, which is why it happens here and
  # not in the repository.
  dump-core-config:
    image: ghcr.io/donatlabs/donat:${ENGINE_TAG:-latest}
    command:
      ["dump-core-config", "--metadata-dir", "/metadata", "--out", "/snapshot/core-config.json"]
    depends_on:
      migrate-domain:
        condition: service_completed_successfully
    environment:
      DONAT_GRAPHQL_DATABASE_URL: postgresql://postgres:postgres@db:5432/petshop_golang
    volumes:
      - ./metadata:/metadata:ro
      - snapshot:/snapshot
    restart: "no"

  app:
    # Build context is the repo root so Docker can see both sdk/go and
    # examples/petshop-golang (the module uses a replace directive).
    build:
      context: ../..
      dockerfile: examples/petshop-golang/Dockerfile
    depends_on:
      dump-core-config:
        condition: service_completed_successfully
    environment:
      # donat.Main reads both from the environment, the way the standalone
      # engine reads its own configuration.
      DONAT_DATABASE_URL: postgresql://postgres:postgres@db:5432/petshop_golang
      DONAT_CORE_CONFIG: /snapshot/core-config.json
    volumes:
      - snapshot:/snapshot:ro
    ports:
      - "8080:8080"

volumes:
  # The compiled snapshot, handed from the one-shot generator to the app.
  snapshot:
