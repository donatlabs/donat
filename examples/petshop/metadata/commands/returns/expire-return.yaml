name: expire_return
source: default
permissions:
  - role: support
arguments:
  - name: return_id
    type: uuid!
  - name: decision_id
    type: uuid!
  # Which deadline passed. The audit row is the only account of why a shopper's
  # request was refused without anybody deciding it.
  - name: reason
    type: string!
steps:
  - name: return_request
    select_one:
      table: { schema: public, name: return_request }
      by: { id: { arg: return_id } }
      returning: [id, order_id, status]
      require_found: true
  - name: transition_is_allowed
    assert:
      rule: can_transition_return
      with:
        current: { step: return_request, column: status }
        next: { literal: rejected }
  # The deadline itself is the decision, and it is filed under the store rather
  # than under an agent: nobody at a desk answered this request.
  - name: expiry_audit
    insert:
      table: { schema: public, name: return_event }
      object:
        return_request_id: { step: return_request, column: id }
        event_type: { literal: rejected }
        actor_role: { literal: system }
        request_id: { arg: decision_id }
        reason: { arg: reason }
      returning: [id, return_request_id, event_type, request_id, reason]
  - name: expired_return
    update:
      table: { schema: public, name: return_request }
      where:
        id: { step: return_request, column: id }
        status: { step: return_request, column: status }
      set: { status: { literal: rejected } }
      returning: [id, order_id, status]
      require_affected: true
result:
  return_id: { step: expired_return, column: id }
  order_id: { step: expired_return, column: order_id }
  status: { step: expired_return, column: status }
  audit: { step: expiry_audit }
idempotency:
  key: { argument: decision_id }
  scope:
    - { argument: return_id }
  retention: 365d
