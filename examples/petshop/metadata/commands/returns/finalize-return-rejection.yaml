name: finalize_return_rejection
source: default
permissions:
  - role: fulfilment
arguments:
  - name: return_id
    type: uuid!
  - name: reason_code
    type: string!
  - name: request_id
    type: uuid!
steps:
  - name: return_request
    select_one:
      table: { schema: public, name: return_request }
      by:
        id: { arg: return_id }
        status: { literal: inspected }
      returning: [id, order_id, status]
      require_found: true
  - name: transition_is_allowed
    assert:
      rule: can_transition_return
      with:
        current: { step: return_request, column: status }
        next: { literal: rejected }
  - name: rejection_audit
    insert:
      table: { schema: public, name: return_event }
      object:
        return_request_id: { step: return_request, column: id }
        event_type: { literal: rejected }
        actor_role: { literal: fulfilment }
        request_id: { arg: request_id }
        reason: { arg: reason_code }
      returning: [id, return_request_id, event_type, request_id]
  - name: rejected_return
    update:
      table: { schema: public, name: return_request }
      where:
        id: { step: return_request, column: id }
        status: { literal: inspected }
      set:
        status: { literal: rejected }
      returning: [id, order_id, status]
      require_affected: true
result:
  return_id: { step: rejected_return, column: id }
  status: { step: rejected_return, column: status }
  public_reason_code: { arg: reason_code }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: return_id }
  retention: 365d
