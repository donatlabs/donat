name: reschedule_booking
source: default
permissions:
  - role: customer
arguments:
  - name: booking_id
    type: uuid!
  - name: service_resource_id
    type: uuid!
  - name: slot_key
    type: string!
  - name: starts_at
    type: timestamptz!
  - name: request_id
    type: uuid!
steps:
  - name: booking
    select_one:
      table: public.grooming_booking
      by:
        id: { arg: booking_id }
        customer_id: { session_variable: x-donat-user-id }
      returning: [id, status]
      require_found: true
  # Changing the unique slot key releases the old slot and claims the new one
  # in this same statement; the confirmed-state predicate and unique slot-key
  # constraint are its guarded transition and atomic conflict gate.
  - name: rescheduled_booking
    update:
      table: public.grooming_booking
      where: { id: { step: booking, column: id }, status: { literal: confirmed } }
      set:
        service_resource_id: { arg: service_resource_id }
        slot_key: { arg: slot_key }
        starts_at: { arg: starts_at }
      returning: [id, service_resource_id, slot_key, starts_at, status]
      require_affected: true
  - name: reschedule_audit
    insert:
      table: public.grooming_booking_event
      object:
        booking_id: { step: rescheduled_booking, column: id }
        event_type: { literal: rescheduled }
        actor_role: { literal: customer }
        request_id: { arg: request_id }
      returning: [id, booking_id, event_type, request_id]
result:
  booking_id: { step: rescheduled_booking, column: id }
  slot_key: { step: rescheduled_booking, column: slot_key }
  starts_at: { step: rescheduled_booking, column: starts_at }
  status: { step: rescheduled_booking, column: status }
  audit: { step: reschedule_audit }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: booking_id }
  retention: 365d
