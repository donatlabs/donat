name: reconcile_vendor_payout
source: default
permissions:
  - role: support
arguments:
  - name: payout_id
    type: uuid!
  - name: reconciliation_id
    type: uuid!
  - name: note
    type: string!
steps:
  - name: payout
    select_one:
      table: public.vendor_payout
      by:
        id: { arg: payout_id }
        status: { literal: failed }
      returning: [id, payout_cycle_id, vendor_id, status, net_minor, currency]
      require_found: true
  - name: reconciliation_is_allowed
    assert:
      rule: can_transition_payout
      with:
        current: { step: payout, column: status }
        next: { literal: reconciled }
  - name: reconciliation
    insert:
      table: public.vendor_payout_reconciliation
      object:
        reconciliation_id: { arg: reconciliation_id }
        payout_id: { step: payout, column: id }
        payout_cycle_id: { step: payout, column: payout_cycle_id }
        note: { arg: note }
        reconciled_by_user_id: { session_variable: x-donat-user-id }
      returning: [id, reconciliation_id, payout_id, payout_cycle_id]
  - name: reconciled_payout
    update:
      table: public.vendor_payout
      where:
        id: { step: payout, column: id }
        status: { step: payout, column: status }
      set:
        status: { literal: reconciled }
      returning: [id, payout_cycle_id, vendor_id, status, provider_payout_id, net_minor, currency]
      require_affected: true
result:
  payout: { step: reconciled_payout }
  reconciliation: { step: reconciliation }
idempotency:
  key: { argument: reconciliation_id }
  scope:
    - { argument: payout_id }
  retention: 365d
