name: reconcile_payment
source: default
permissions:
  - role: reconciliation_worker
arguments:
  - name: payment_id
    type: uuid!
  - name: provider_event_id
    type: string!
  - name: reconciliation_decision
    type: ReconciliationDecision!
  - name: provider_amount_minor
    type: bigint!
  - name: provider_currency
    type: string!
  - name: provider_status
    type: PaymentState!
  - name: provider_reference
    type: string!
  - name: payload
    type: BoundedProviderEvidence!
steps:
  - name: payment
    select_one:
      table: public.payment
      by:
        id: { arg: payment_id }
      returning: [id, status, amount_minor, currency, provider_reference]
  - name: decision_is_allowed
    assert:
      rule: payment_reconciliation_supports_decision
      with:
        local_amount_minor: { step: payment, column: amount_minor }
        local_currency: { step: payment, column: currency }
        local_status: { step: payment, column: status }
        local_provider_reference: { step: payment, column: provider_reference }
        provider_amount_minor: { arg: provider_amount_minor }
        provider_currency: { arg: provider_currency }
        provider_status: { arg: provider_status }
        provider_reference: { arg: provider_reference }
        decision: { arg: reconciliation_decision }
  - name: payment_event
    insert:
      table: public.payment_event
      object:
        payment_id: { step: payment, column: id }
        event_type: { literal: reconciliation }
        provider_event_id: { arg: provider_event_id }
        provider_amount_minor: { arg: provider_amount_minor }
        provider_currency: { arg: provider_currency }
        provider_status: { arg: provider_status }
        provider_reference: { arg: provider_reference }
        payload: { arg: payload }
      returning: [id, provider_event_id, provider_amount_minor, provider_currency, provider_status, provider_reference]
  - name: reconciliation
    insert:
      table: public.payment_reconciliation
      object:
        payment_id: { step: payment, column: id }
        provider_event_id: { step: payment_event, column: provider_event_id }
        provider_amount_minor: { arg: provider_amount_minor }
        provider_currency: { arg: provider_currency }
        provider_status: { arg: provider_status }
        provider_reference: { arg: provider_reference }
        decision: { arg: reconciliation_decision }
        status:
          rule: reconciliation_state_for_decision
          with:
            decision: { arg: reconciliation_decision }
      returning: [id, payment_id, provider_event_id, decision, status]
result:
  payment_id: { step: payment, column: id }
  reconciliation_id: { step: reconciliation, column: id }
  reconciliation_status: { step: reconciliation, column: status }
idempotency:
  key: { argument: provider_event_id }
  scope: command
  retention: 365d
