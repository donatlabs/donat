name: authorize_payment
source: default
permissions:
  - role: payment_worker
arguments:
  - name: order_id
    type: uuid!
  - name: payment_id
    type: uuid!
  - name: provider_authorization_id
    type: string!
  - name: provider_event_id
    type: string!
  - name: provider_reference
    type: string!
  - name: amount_minor
    type: bigint!
  - name: payload
    type: BoundedProviderEvidence!
steps:
  - name: payment
    select_one:
      table: public.payment
      by:
        id: { arg: payment_id }
        order_id: { arg: order_id }
        status: { literal: pending }
      returning: [id, order_id, status, amount_minor, currency]
  - name: authorization_is_allowed
    assert:
      rule: can_authorize_payment_amount
      with:
        current_state: { step: payment, column: status }
        payment_amount_minor: { step: payment, column: amount_minor }
        requested_amount_minor: { arg: amount_minor }
  - name: payment_event
    insert:
      table: public.payment_event
      object:
        payment_id: { step: payment, column: id }
        event_type: { literal: authorization }
        provider_event_id: { arg: provider_event_id }
        payload: { arg: payload }
      returning: [id, provider_event_id]
  - name: authorization
    insert:
      table: public.payment_authorization
      object:
        payment_id: { step: payment, column: id }
        provider_authorization_id: { arg: provider_authorization_id }
        authorized_minor: { arg: amount_minor }
        captured_minor: { literal: 0 }
        capture_reserved_minor: { literal: 0 }
        status: { literal: authorized }
      returning: [id, payment_id, authorized_minor, captured_minor, capture_reserved_minor, status]
  - name: mark_authorized
    update:
      table: public.payment
      where:
        id: { step: payment, column: id }
        status: { literal: pending }
      set:
        status: { literal: authorized }
        provider_reference: { arg: provider_reference }
      returning: [id, order_id, status, provider_reference]
      require_affected: true
  - name: order
    select_one:
      table: public.orders
      by:
        id: { arg: order_id }
        order_status: { literal: checkout_started }
      returning: [id, order_status]
      require_found: true
  - name: mark_order_authorized
    update:
      table: public.orders
      where:
        id: { step: order, column: id }
        order_status: { literal: checkout_started }
      set:
        order_status: { literal: authorized }
      returning: [id, order_status]
      require_affected: true
result:
  payment_id: { step: mark_authorized, column: id }
  payment_status: { step: mark_authorized, column: status }
  authorization_id: { step: authorization, column: id }
  order_id: { step: mark_order_authorized, column: id }
  order_status: { step: mark_order_authorized, column: order_status }
idempotency:
  key: { argument: provider_event_id }
  retention: 365d
