name: open_approver_review
source: default
permissions:
  - role: b2b_finance
arguments:
  - name: approval_id
    type: uuid!
  - name: request_id
    type: uuid!
steps:
  - name: approval
    select_one:
      table: public.purchase_approval
      by:
        id: { arg: approval_id }
        status: { literal: submitted }
      returning: [id, quote_id, status]
      require_found: true
  - name: review_is_allowed
    assert:
      rule: can_transition_approval
      with:
        current: { step: approval, column: status }
        next: { literal: awaiting_approver }
  - name: open_review
    update:
      table: public.purchase_approval
      where:
        id: { step: approval, column: id }
        status: { literal: submitted }
      set:
        status: { literal: awaiting_approver }
      returning: [id, quote_id, status]
      require_affected: true
result:
  approval_id: { step: open_review, column: id }
  quote_id: { step: open_review, column: quote_id }
  approval_status: { step: open_review, column: status }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: approval_id }
  retention: 365d
