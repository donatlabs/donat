name: finance_reject_purchase
source: default
permissions:
  - role: b2b_finance
arguments:
  - name: approval_id
    type: uuid!
  - name: reason
    type: string!
  - name: request_id
    type: uuid!
steps:
  - name: approval
    select_one:
      table: public.purchase_approval
      by:
        id: { arg: approval_id }
        status: { literal: awaiting_finance }
      returning: [id, quote_id, status]
      require_found: true
  - name: rejection_is_allowed
    assert:
      rule: can_transition_approval
      with:
        current: { step: approval, column: status }
        next: { literal: rejected }
  - name: reject
    update:
      table: public.purchase_approval
      where:
        id: { step: approval, column: id }
        status: { literal: awaiting_finance }
      set:
        status: { literal: rejected }
        rejected_by_user_id: { session_variable: x-donat-user-id }
        rejection_reason: { arg: reason }
      returning: [id, quote_id, status, rejection_reason]
      require_affected: true
result:
  approval_id: { step: reject, column: id }
  quote_id: { step: reject, column: quote_id }
  approval_status: { step: reject, column: status }
  rejection_reason: { step: reject, column: rejection_reason }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: approval_id }
  retention: 365d
effects:
  - signal_process:
      process: b2b_order_approval
      signal: finance_decision
      correlate:
        approval_id: { step: reject, column: id }
      payload:
        decision: { literal: rejected }
      idempotency_key: { argument: request_id }
