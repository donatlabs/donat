name: begin_checkout
source: default
permissions:
  - role: customer
arguments:
  - name: checkout_quote_id
    type: uuid!
  - name: provider_checkout_quote_id
    type: uuid!
  - name: tax_quote_id
    type: string!
  - name: tax_minor
    type: bigint!
  - name: tax_code
    type: string!
  - name: tax_currency
    type: string!
  - name: request_id
    type: uuid!
steps:
  - name: quote
    select_one:
      table: public.checkout_quote
      by:
        id: { arg: checkout_quote_id }
        customer_id: { session_variable: x-donat-user-id }
        status: { literal: awaiting_tax }
      returning:
        [id, cart_id, customer_id, price_list_code, promotion_code,
         shipping_service_code, subtotal_minor, discount_minor, shipping_minor,
         taxable_minor, currency, destination_country_code, status]
      require_found: true
  - name: tax_quote_matches
    assert:
      rule: tax_quote_matches_checkout
      with:
        expected_quote_id: { step: quote, column: id }
        actual_quote_id: { arg: provider_checkout_quote_id }
        expected_currency: { step: quote, column: currency }
        actual_currency: { arg: tax_currency }
        tax_minor: { arg: tax_minor }
  - name: quoted_lines
    select_many:
      table: public.checkout_quote_line
      by:
        checkout_quote_id: { step: quote, column: id }
      order_by: [variant_id]
      returning:
        [variant_id, quantity, taxable_category, tax_code, tax_bps, unit_price_minor,
         line_subtotal_minor, discount_minor, taxable_minor, currency]
      require_non_empty: true
      maximum_rows: 64
  - name: final_total
    project:
      values:
        total_minor:
          rule: add_minor
          with:
            left:
              rule: add_minor
              with:
                left: { step: quote, column: taxable_minor }
                right: { step: quote, column: shipping_minor }
            right: { arg: tax_minor }
        currency: { step: quote, column: currency }
  - name: reserve_stock
    update_many:
      table: public.inventory_stock
      for_each: { step: quoted_lines }
      by:
        variant_id: { item: variant_id }
      set:
        reserved:
          rule: add_int
          with:
            left: { current_column: reserved }
            right: { item: quantity }
      check:
        rule: can_reserve_stock
        with:
          on_hand: { current_column: on_hand }
          reserved: { current_column: reserved }
          requested: { item: quantity }
      returning: [variant_id, reserved]
      require_each: true
  - name: order
    insert:
      table: public.orders
      object:
        customer_id: { step: quote, column: customer_id }
        checkout_quote_id: { step: quote, column: id }
        order_status: { literal: checkout_started }
        subtotal_minor: { step: quote, column: subtotal_minor }
        discount_minor: { step: quote, column: discount_minor }
        shipping_minor: { step: quote, column: shipping_minor }
        tax_minor: { arg: tax_minor }
        total_minor: { step: final_total, column: total_minor }
        currency: { step: final_total, column: currency }
      returning:
        [id, customer_id, checkout_quote_id, order_status, subtotal_minor,
         discount_minor, shipping_minor, tax_minor, total_minor, currency]
  - name: order_lines
    insert_many:
      table: public.order_line
      for_each: { step: quoted_lines }
      maximum_items: 64
      object:
        order_id: { step: order, column: id }
        variant_id: { item: variant_id }
        quantity: { item: quantity }
        unit_price_minor: { item: unit_price_minor }
        line_subtotal_minor: { item: line_subtotal_minor }
        discount_minor: { item: discount_minor }
        taxable_minor: { item: taxable_minor }
        tax_code: { item: tax_code }
        tax_bps: { item: tax_bps }
        currency: { item: currency }
      returning:
        [id, variant_id, quantity, tax_code, tax_bps, unit_price_minor, line_subtotal_minor,
         discount_minor, taxable_minor, currency]
  - name: adjustment_snapshots
    fixed_rows:
      maximum_rows: 4
      rows:
        - kind: { literal: promotion }
          code: { step: quote, column: promotion_code }
          provider_reference: { literal: null }
          amount_minor: { step: quote, column: discount_minor }
        - kind: { literal: shipping }
          code: { step: quote, column: shipping_service_code }
          provider_reference: { literal: null }
          amount_minor: { step: quote, column: shipping_minor }
        - kind: { literal: tax }
          code: { arg: tax_code }
          provider_reference: { arg: tax_quote_id }
          amount_minor: { arg: tax_minor }
        - kind: { literal: price_list }
          code: { step: quote, column: price_list_code }
          provider_reference: { literal: null }
          amount_minor: { literal: 0 }
  - name: order_adjustments
    insert_many:
      table: public.order_adjustment
      for_each: { step: adjustment_snapshots }
      maximum_items: 4
      object:
        order_id: { step: order, column: id }
        kind: { item: kind }
        code: { item: code }
        provider_reference: { item: provider_reference }
        amount_minor: { item: amount_minor }
        currency: { step: order, column: currency }
      returning:
        [id, order_id, kind, code, provider_reference, amount_minor, currency]
  - name: reservations
    insert_many:
      table: public.inventory_reservation
      for_each: { step: quoted_lines }
      maximum_items: 64
      object:
        order_id: { step: order, column: id }
        variant_id: { item: variant_id }
        quantity: { item: quantity }
        status: { literal: reserved }
      returning: [id, order_id, variant_id, quantity, status]
  - name: payment
    insert:
      table: public.payment
      object:
        order_id: { step: order, column: id }
        status: { literal: pending }
        amount_minor: { step: order, column: total_minor }
        currency: { step: order, column: currency }
      returning: [id, order_id, status, amount_minor, currency]
  - name: close_cart
    update:
      table: public.cart
      where:
        id: { step: quote, column: cart_id }
        customer_id: { step: quote, column: customer_id }
        status: { literal: cart_open }
      set:
        status: { literal: checkout_started }
      returning: [id, status]
      require_affected: true
  - name: consume_quote
    update:
      table: public.checkout_quote
      where:
        id: { step: quote, column: id }
        status: { literal: awaiting_tax }
      set:
        status: { literal: consumed }
        tax_quote_id: { arg: tax_quote_id }
        tax_minor: { arg: tax_minor }
        tax_code: { arg: tax_code }
      returning: [id, status, tax_quote_id, tax_minor, tax_code]
      require_affected: true
result:
  order_id: { step: order, column: id }
  payment_id: { step: payment, column: id }
  total_minor: { step: order, column: total_minor }
  currency: { step: order, column: currency }
  pricing_snapshot: { step: order_adjustments }
  allocation_candidates: { step: quoted_lines }
idempotency:
  key: { argument: request_id }
  scope:
    - { session_variable: x-donat-user-id }
  retention: 30d
