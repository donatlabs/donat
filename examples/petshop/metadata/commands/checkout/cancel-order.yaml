name: cancel_order
source: default
permissions:
  - role: customer
  - role: support
arguments:
  - name: order_id
    type: uuid!
  - name: request_id
    type: uuid!
steps:
  - name: order
    select_one:
      table: public.orders
      by:
        id: { arg: order_id }
      returning: [id, customer_id, order_status]
  - name: cancellation_is_allowed
    assert:
      rule: can_transition_checkout
      with:
        current: { step: order, column: order_status }
        next: { literal: cancelled }
  - name: remaining_reservations
    select_many:
      table: public.inventory_reservation
      by:
        order_id: { step: order, column: id }
        status: { literal: reserved }
      order_by: [id]
      returning: [id, variant_id, quantity]
  - name: release_stock
    update_many:
      table: public.inventory_stock
      for_each: { step: remaining_reservations }
      by:
        variant_id: { item: variant_id }
      set:
        reserved:
          rule: subtract_int
          with:
            left: { current_column: reserved }
            right: { item: quantity }
      check:
        rule: can_release_stock
        with:
          reserved: { current_column: reserved }
          releasing: { item: quantity }
      returning: [variant_id, reserved]
      require_each: true
  - name: release_reservations
    update_many:
      table: public.inventory_reservation
      for_each: { step: remaining_reservations }
      by:
        id: { item: id }
      set:
        status: { literal: released }
      returning: [id, status]
      require_each: true
  - name: cancel_order
    update:
      table: public.orders
      where:
        id: { step: order, column: id }
      set:
        order_status: { literal: cancelled }
      returning: [id, order_status]
result:
  order_id: { step: cancel_order, column: id }
  order_status: { step: cancel_order, column: order_status }
  released_reservations: { step: release_reservations }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: order_id }
    - { session_variable: x-donat-user-id }
  retention: 30d
