name: cancel_order
source: default
permissions:
  - role: customer
  - role: support
arguments:
  - name: order_id
    type: uuid!
  - name: request_id
    type: uuid!
steps:
  - name: order
    select_one:
      table: public.orders
      by:
        id: { arg: order_id }
        order_status: { literal: checkout_started }
      returning: [id, customer_id, order_status]
      require_found: true
  - name: cancellation_is_allowed
    assert:
      rule: can_transition_checkout
      with:
        current: { step: order, column: order_status }
        next: { literal: cancellation_requested }
  - name: payment
    select_one:
      table: public.payment
      by:
        order_id: { step: order, column: id }
        status: { literal: pending }
      returning: [id, status, authorization_activity_key]
      require_found: true
  # This guarded payment update wins or loses against authorize_payment's
  # guarded pending -> authorized update. It does not release inventory.
  - name: claim_pending_cancellation
    update:
      table: public.payment
      where:
        id: { step: payment, column: id }
        status: { literal: pending }
      set:
        status: { literal: cancellation_requested }
      returning: [id, order_id, status, authorization_activity_key]
      require_affected: true
  - name: request_cancellation
    update:
      table: public.orders
      where:
        id: { step: order, column: id }
        order_status: { literal: checkout_started }
      set:
        order_status: { literal: cancellation_requested }
        cancellation_reason: { literal: checkout_cancelled }
      returning: [id, customer_id, order_status, cancellation_reason]
      require_affected: true
result:
  order_id: { step: request_cancellation, column: id }
  owner_user_id: { step: request_cancellation, column: customer_id }
  order_status: { step: request_cancellation, column: order_status }
  payment_id: { step: claim_pending_cancellation, column: id }
  authorization_activity_key: { step: claim_pending_cancellation, column: authorization_activity_key }
  reason: { step: request_cancellation, column: cancellation_reason }
idempotency:
  key: { argument: request_id }
  scope:
    - { argument: order_id }
    - { session_variable: x-donat-user-id }
  retention: 365d
effects:
  - start_process:
      process: checkout_cancellation
      process_key: { step: request_cancellation, column: id }
      input:
        order_id: { step: request_cancellation, column: id }
        owner_user_id: { step: request_cancellation, column: customer_id }
        payment_id: { step: claim_pending_cancellation, column: id }
        authorization_activity_key: { step: claim_pending_cancellation, column: authorization_activity_key }
        reason: { step: request_cancellation, column: cancellation_reason }
      idempotency_key: { argument: request_id }
