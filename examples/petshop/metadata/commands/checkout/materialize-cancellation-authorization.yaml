name: materialize_cancellation_authorization
source: default
permissions:
  - role: payment_worker
arguments:
  - { name: order_id, type: uuid! }
  - { name: payment_id, type: uuid! }
  - { name: provider_authorization_id, type: string! }
  - { name: provider_event_id, type: string! }
  - { name: amount_minor, type: bigint! }
  - { name: provider_reference, type: string! }
  - { name: payload, type: BoundedProviderEvidence! }
steps:
  - name: payment
    select_one:
      table: public.payment
      by:
        id: { arg: payment_id }
        order_id: { arg: order_id }
        status: { literal: cancellation_requested }
      returning: [id, order_id, amount_minor, currency, status]
      require_found: true
  - name: amount_matches
    assert:
      rule: can_materialize_cancellation_authorization
      with:
        payment_state: { step: payment, column: status }
        payment_amount_minor: { step: payment, column: amount_minor }
        provider_amount_minor: { arg: amount_minor }
  - name: event
    insert:
      table: public.payment_event
      object:
        payment_id: { step: payment, column: id }
        event_type: { literal: authorization_found_during_cancellation }
        provider_event_id: { arg: provider_event_id }
        payload: { arg: payload }
      returning: [id, provider_event_id]
  - name: authorization
    insert:
      table: public.payment_authorization
      object:
        payment_id: { step: payment, column: id }
        provider_authorization_id: { arg: provider_authorization_id }
        authorized_minor: { arg: amount_minor }
        captured_minor: { literal: 0 }
        capture_reserved_minor: { literal: 0 }
        status: { literal: void_in_progress }
      returning:
        [id, payment_id, authorized_minor, captured_minor,
         capture_reserved_minor, status]
  - name: claim_payment_for_void
    update:
      table: public.payment
      where:
        id: { step: payment, column: id }
        status: { literal: cancellation_requested }
      set:
        status: { literal: void_in_progress }
        provider_reference: { arg: provider_reference }
      returning: [id, order_id, status]
      require_affected: true
result:
  order_id: { step: claim_payment_for_void, column: order_id }
  payment_id: { step: claim_payment_for_void, column: id }
  authorization_id: { step: authorization, column: id }
idempotency:
  key: { argument: provider_event_id }
  scope: command
  retention: 365d
