name: reject_prescription
source: default
permissions:
  - role: veterinary_reviewer
arguments:
  - name: prescription_id
    type: uuid!
  - name: decision_id
    type: uuid!
  - name: review_note
    type: string
steps:
  - name: prescription_request
    select_one:
      table: public.prescription_request
      by: { id: { arg: prescription_id } }
      returning: [id, status]
      require_found: true
  - name: rejection_is_allowed
    assert:
      rule: can_transition_prescription
      with:
        current: { step: prescription_request, column: status }
        next: { literal: rejected }
  - name: rejected_review
    insert:
      table: public.prescription_review
      object:
        prescription_request_id: { step: prescription_request, column: id }
        decision: { literal: rejected }
        reviewer_user_id: { session_variable: x-donat-user-id }
        decision_id: { arg: decision_id }
        private_note: { arg: review_note }
      returning: [id, prescription_request_id, decision, decision_id]
  - name: rejection_audit
    insert:
      table: public.prescription_event
      object:
        prescription_request_id: { step: prescription_request, column: id }
        event_type: { literal: rejected }
        actor_role: { literal: veterinary_reviewer }
        request_id: { arg: decision_id }
      returning: [id, prescription_request_id, event_type, request_id]
  - name: rejected_request
    update:
      table: public.prescription_request
      where: { id: { step: prescription_request, column: id }, status: { literal: submitted } }
      set: { status: { literal: rejected } }
      returning: [id, status]
      require_affected: true
result:
  prescription_id: { step: rejected_request, column: id }
  status: { step: rejected_request, column: status }
  audit: { step: rejection_audit }
idempotency:
  key: { argument: decision_id }
  scope:
    - { argument: prescription_id }
  retention: 365d
effects:
  - signal_process:
      process: prescription_review
      signal: prescription_decision_recorded
      correlate:
        prescription_id: { step: rejected_request, column: id }
      payload: { decision: { literal: rejected } }
      idempotency_key: { argument: decision_id }
