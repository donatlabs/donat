- name: list_products
  url: products
  methods:
    - GET
  definition:
    query:
      collection_name: petshop
      query_name: Products
  comment: Browse the public published catalogue.

- name: get_product_by_slug
  url: products/:slug
  methods:
    - GET
  definition:
    query:
      collection_name: petshop
      query_name: ProductBySlug
  comment: Read one published product by slug.

- name: get_cart
  url: cart
  methods:
    - GET
  definition:
    query:
      collection_name: petshop
      query_name: Cart
  comment: Read the caller's own cart.

- name: put_cart_lines
  url: cart/lines
  methods:
    - PUT
  definition:
    query:
      collection_name: petshop
      query_name: UpsertCartLine
  comment: Reuse the permission-aware GraphQL cart-line upsert.

- name: list_orders
  url: orders
  methods:
    - GET
  definition:
    query:
      collection_name: petshop
      query_name: Orders
  comment: Read the caller's own orders.

- name: get_order_by_id
  url: orders/:id
  methods:
    - GET
  definition:
    query:
      collection_name: petshop
      query_name: OrderById
  comment: Read one caller-visible order by UUID.
