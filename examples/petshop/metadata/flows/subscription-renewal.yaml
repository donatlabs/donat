name: subscription_renewal
kind: process
version: 1
source: default
permissions:
  - role: subscription_worker
input:
  - { name: subscription_id, type: uuid! }
  - { name: cron_occurrence, type: timestamptz! }
idempotency:
  key: { input: cron_occurrence }
  scope:
    - { input: subscription_id }
output:
  - { name: subscription_id, type: uuid! }
  - { name: renewal_id, type: uuid! }
  - { name: order_id, type: uuid! }
  - { name: payment_id, type: uuid! }
  - { name: status, type: string! }
start_at: create_renewal_order
states:
  - id: create_renewal_order
    command:
      name: create_subscription_order
      run_as: subscription_worker
      arguments:
        subscription_id: { input: subscription_id }
        cron_occurrence: { input: cron_occurrence }
      next: authorize_initial

  - id: authorize_initial
    request:
      connector: mock_payment
      operation: authorize
      input:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        currency: { state: create_renewal_order, field: currency }
        request_id: { activity_key: authorize_initial }
      idempotency_key:
        stable: { run: id, state: authorize_initial }
      timeout:
        schedule_to_start: 5s
        start_to_close: 5s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_initial_outcome
      on_error:
        routes:
          - { kinds: [authentication, validation], next: reconcile_initial }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: reconcile_initial }
        fallback: { next: reconcile_initial }
  - id: reconcile_initial
    request:
      connector: mock_payment
      operation: lookup_operation
      input:
        payment_id: { state: create_renewal_order, field: payment_id }
        resource_kind: { literal: authorization }
        resource_id: { state: create_renewal_order, field: renewal_id, as: string }
        activity_key: { activity_key: authorize_initial }
      timeout:
        schedule_to_start: 5s
        start_to_close: 6s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_reconciled_initial
      on_error:
        routes:
          - { kinds: [authentication, validation], next: provider_outcome_ambiguous }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: provider_outcome_ambiguous }
        fallback: { next: provider_outcome_ambiguous }
  - id: route_reconciled_initial
    when:
      cases:
        - matches: { found: true, outcome: authorized }
          next: record_reconciled_initial_authorization
        - matches: { found: true, outcome: declined }
          next: record_reconciled_initial_decline
        - matches: { found: true, outcome: failed }
          next: record_reconciled_initial_decline
      default: provider_outcome_ambiguous
  - id: route_initial_outcome
    when:
      cases:
        - matches: { status: authorized }
          next: record_initial_authorization
        - matches: { status: declined }
          next: record_initial_decline
        - matches: { status: failed }
          next: record_initial_decline
      default: provider_outcome_ambiguous
  - id: record_initial_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: authorize_initial, field: provider_authorization_id }
        provider_event_id: { state: authorize_initial, field: provider_event_id }
        provider_reference: { state: authorize_initial, field: provider_reference }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        payload: { state: authorize_initial, field: normalized_payload }
      next: record_initial_renewal
  - id: record_reconciled_initial_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: reconcile_initial, field: provider_mutation_id }
        provider_event_id: { state: reconcile_initial, field: provider_event_id }
        provider_reference: { state: reconcile_initial, field: provider_reference }
        amount_minor: { state: reconcile_initial, field: amount_minor }
        payload: { state: reconcile_initial, field: normalized_payload }
      next: record_reconciled_initial_renewal
  - id: record_initial_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 0 }
        outcome: { state: authorize_initial, field: status }
        provider_event_id: { state: authorize_initial, field: provider_event_id }
        provider_reference: { state: authorize_initial, field: provider_reference }
        payload: { state: authorize_initial, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_reconciled_initial_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 0 }
        outcome: { state: reconcile_initial, field: outcome }
        provider_event_id: { state: reconcile_initial, field: provider_event_id }
        provider_reference: { state: reconcile_initial, field: provider_reference }
        payload: { state: reconcile_initial, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_initial_decline
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 0 }
        outcome: { state: authorize_initial, field: status }
        provider_event_id: { state: authorize_initial, field: provider_event_id }
        provider_reference: { state: authorize_initial, field: provider_reference }
        payload: { state: authorize_initial, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: wait_first_dunning_delay
  - id: record_reconciled_initial_decline
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 0 }
        outcome: { state: reconcile_initial, field: outcome }
        provider_event_id: { state: reconcile_initial, field: provider_event_id }
        provider_reference: { state: reconcile_initial, field: provider_reference }
        payload: { state: reconcile_initial, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: wait_first_dunning_delay

  - id: wait_first_dunning_delay
    wait:
      timer:
        decision_table: dunning_schedule
        with: { attempt: { literal: 1 } }
        output: delay_seconds
      next: authorize_first_retry
  - id: authorize_first_retry
    request:
      connector: mock_payment
      operation: authorize
      input:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        currency: { state: create_renewal_order, field: currency }
        request_id: { activity_key: authorize_first_retry }
      idempotency_key:
        stable: { run: id, state: authorize_first_retry }
      timeout:
        schedule_to_start: 5s
        start_to_close: 5s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_first_retry
      on_error:
        routes:
          - { kinds: [authentication, validation], next: reconcile_first_retry }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: reconcile_first_retry }
