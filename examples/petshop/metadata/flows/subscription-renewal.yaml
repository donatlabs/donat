        resource_kind: { literal: authorization }
        resource_id: { state: create_renewal_order, field: renewal_id, as: string }
        activity_key: { activity_key: authorize_first_retry }
      timeout:
        schedule_to_start: 5s
        start_to_close: 6s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_reconciled_first_retry
      on_error:
        routes:
          - { kinds: [authentication, validation], next: provider_outcome_ambiguous }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: provider_outcome_ambiguous }
        fallback: { next: provider_outcome_ambiguous }
  - id: route_first_retry
    when:
      cases:
        - matches: { status: authorized }
          next: record_first_authorization
        - matches: { status: declined }
          next: record_first_decline
        - matches: { status: failed }
          next: record_first_decline
      default: provider_outcome_ambiguous
  - id: route_reconciled_first_retry
    when:
      cases:
        - matches: { found: true, outcome: authorized }
          next: record_reconciled_first_authorization
        - matches: { found: true, outcome: declined }
          next: record_reconciled_first_decline
        - matches: { found: true, outcome: failed }
          next: record_reconciled_first_decline
      default: provider_outcome_ambiguous
  - id: record_first_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: authorize_first_retry, field: provider_authorization_id }
        provider_event_id: { state: authorize_first_retry, field: provider_event_id }
        provider_reference: { state: authorize_first_retry, field: provider_reference }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        payload: { state: authorize_first_retry, field: normalized_payload }
      next: record_first_renewal
  - id: record_reconciled_first_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: reconcile_first_retry, field: provider_mutation_id }
        provider_event_id: { state: reconcile_first_retry, field: provider_event_id }
        provider_reference: { state: reconcile_first_retry, field: provider_reference }
        amount_minor: { state: reconcile_first_retry, field: amount_minor }
        payload: { state: reconcile_first_retry, field: normalized_payload }
      next: record_reconciled_first_renewal
  - id: record_first_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 1 }
        outcome: { state: authorize_first_retry, field: status }
        provider_event_id: { state: authorize_first_retry, field: provider_event_id }
        provider_reference: { state: authorize_first_retry, field: provider_reference }
        payload: { state: authorize_first_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_reconciled_first_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 1 }
        outcome: { state: reconcile_first_retry, field: outcome }
        provider_event_id: { state: reconcile_first_retry, field: provider_event_id }
        provider_reference: { state: reconcile_first_retry, field: provider_reference }
        payload: { state: reconcile_first_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_first_decline
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 1 }
        outcome: { state: authorize_first_retry, field: status }
        provider_event_id: { state: authorize_first_retry, field: provider_event_id }
        provider_reference: { state: authorize_first_retry, field: provider_reference }
        payload: { state: authorize_first_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: wait_second_dunning_delay
  - id: record_reconciled_first_decline
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 1 }
        outcome: { state: reconcile_first_retry, field: outcome }
        provider_event_id: { state: reconcile_first_retry, field: provider_event_id }
        provider_reference: { state: reconcile_first_retry, field: provider_reference }
        payload: { state: reconcile_first_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: wait_second_dunning_delay

  - id: wait_second_dunning_delay
    wait:
      timer:
        decision_table: dunning_schedule
        with: { attempt: { literal: 2 } }
        output: delay_seconds
      next: authorize_second_retry
  - id: authorize_second_retry
    request:
      connector: mock_payment
      operation: authorize
      input:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        currency: { state: create_renewal_order, field: currency }
        request_id: { activity_key: authorize_second_retry }
      idempotency_key:
        stable: { run: id, state: authorize_second_retry }
      timeout:
        schedule_to_start: 5s
        start_to_close: 5s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_second_retry
      on_error:
        routes:
          - { kinds: [authentication, validation], next: reconcile_second_retry }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: reconcile_second_retry }
        fallback: { next: reconcile_second_retry }
  - id: reconcile_second_retry
    request:
      connector: mock_payment
      operation: lookup_operation
      input:
        payment_id: { state: create_renewal_order, field: payment_id }
        resource_kind: { literal: authorization }
        resource_id: { state: create_renewal_order, field: renewal_id, as: string }
        activity_key: { activity_key: authorize_second_retry }
      timeout:
        schedule_to_start: 5s
        start_to_close: 6s
      retry:
        retry_on: [transport, timeout, http_429, http_5xx]
        max_attempts: 3
        initial_interval: 100ms
        max_interval: 1s
        jitter: deterministic_full
      next: route_reconciled_second_retry
      on_error:
        routes:
          - { kinds: [authentication, validation], next: provider_outcome_ambiguous }
          - { kinds: [permanent, invariant, timeout, retry_exhausted], next: provider_outcome_ambiguous }
        fallback: { next: provider_outcome_ambiguous }
  - id: route_second_retry
    when:
      cases:
        - matches: { status: authorized }
          next: record_second_authorization
        - matches: { status: declined }
          next: record_terminal_decline
        - matches: { status: failed }
          next: record_terminal_decline
      default: provider_outcome_ambiguous
  - id: route_reconciled_second_retry
    when:
      cases:
        - matches: { found: true, outcome: authorized }
          next: record_reconciled_second_authorization
        - matches: { found: true, outcome: declined }
          next: record_reconciled_terminal_decline
        - matches: { found: true, outcome: failed }
          next: record_reconciled_terminal_decline
      default: provider_outcome_ambiguous
  - id: record_second_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: authorize_second_retry, field: provider_authorization_id }
        provider_event_id: { state: authorize_second_retry, field: provider_event_id }
        provider_reference: { state: authorize_second_retry, field: provider_reference }
        amount_minor: { state: create_renewal_order, field: amount_minor }
        payload: { state: authorize_second_retry, field: normalized_payload }
      next: record_second_renewal
  - id: record_reconciled_second_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_authorization_id: { state: reconcile_second_retry, field: provider_mutation_id }
        provider_event_id: { state: reconcile_second_retry, field: provider_event_id }
        provider_reference: { state: reconcile_second_retry, field: provider_reference }
        amount_minor: { state: reconcile_second_retry, field: amount_minor }
        payload: { state: reconcile_second_retry, field: normalized_payload }
      next: record_reconciled_second_renewal
  - id: record_second_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 2 }
        outcome: { state: authorize_second_retry, field: status }
        provider_event_id: { state: authorize_second_retry, field: provider_event_id }
        provider_reference: { state: authorize_second_retry, field: provider_reference }
        payload: { state: authorize_second_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_reconciled_second_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 2 }
        outcome: { state: reconcile_second_retry, field: outcome }
        provider_event_id: { state: reconcile_second_retry, field: provider_event_id }
        provider_reference: { state: reconcile_second_retry, field: provider_reference }
        payload: { state: reconcile_second_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: renewed
  - id: record_terminal_decline
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_event_id: { state: authorize_second_retry, field: provider_event_id }
        outcome: { state: authorize_second_retry, field: status }
        provider_reference: { state: authorize_second_retry, field: provider_reference }
        payload: { state: authorize_second_retry, field: normalized_payload }
      next: record_terminal_renewal
  - id: record_reconciled_terminal_decline
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: create_renewal_order, field: payment_id }
        provider_event_id: { state: reconcile_second_retry, field: provider_event_id }
        outcome: { state: reconcile_second_retry, field: outcome }
        provider_reference: { state: reconcile_second_retry, field: provider_reference }
        payload: { state: reconcile_second_retry, field: normalized_payload }
      next: record_reconciled_terminal_renewal
  - id: record_terminal_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 2 }
        outcome: { state: authorize_second_retry, field: status }
        provider_event_id: { state: authorize_second_retry, field: provider_event_id }
        provider_reference: { state: authorize_second_retry, field: provider_reference }
        payload: { state: authorize_second_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: terminal_pause
  - id: record_reconciled_terminal_renewal
    command:
      name: record_renewal_outcome
      run_as: subscription_worker
      arguments:
        renewal_id: { state: create_renewal_order, field: renewal_id }
        attempt: { literal: 2 }
        outcome: { state: reconcile_second_retry, field: outcome }
        provider_event_id: { state: reconcile_second_retry, field: provider_event_id }
        provider_reference: { state: reconcile_second_retry, field: provider_reference }
        payload: { state: reconcile_second_retry, field: normalized_payload }
        occurred_at: { workflow_time: now }
      next: terminal_pause
  - id: terminal_pause
    command:
      name: pause_subscription
      run_as: subscription_worker
      arguments:
        subscription_id: { input: subscription_id }
        reason: { literal: dunning_schedule_exhausted }
        request_id: { activity_key: terminal_pause, as: uuid }
      next: paused

  - id: renewed
    output:
      values:
        subscription_id: { input: subscription_id }
        renewal_id: { state: create_renewal_order, field: renewal_id }
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        status: { literal: renewed }
  - id: paused
    output:
      values:
        subscription_id: { input: subscription_id }
        renewal_id: { state: create_renewal_order, field: renewal_id }
        order_id: { state: create_renewal_order, field: order_id }
        payment_id: { state: create_renewal_order, field: payment_id }
        status: { literal: paused }
  - id: provider_outcome_ambiguous
    fail:
      code: subscription_payment_requires_reconciliation
      message: The payment outcome is ambiguous; the subscription remains payment_due and no retry stage is skipped
