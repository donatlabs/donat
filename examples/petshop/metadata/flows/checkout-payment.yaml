name: checkout_payment
kind: process
version: 1
source: default
permissions:
  - role: customer
    owner_session_variable: x-donat-user-id
owner:
  type: bigint!
  capture: { session_variable: x-donat-user-id }
input:
  - { name: cart_id, type: bigint! }
  - { name: request_id, type: uuid! }
idempotency:
  key: { input: request_id }
  scope:
    - { session_variable: x-donat-user-id }
output:
  - { name: order_id, type: uuid! }
  - { name: payment_id, type: uuid! }
  - { name: payment_status, type: PaymentOutcome! }
start_at: prepare_quote
states:
  - id: prepare_quote
    command:
      name: prepare_checkout_quote
      run_as: caller
      arguments:
        cart_id: { input: cart_id }
        request_id: { input: request_id }
      next: request_tax_quote

  - id: request_tax_quote
    request:
      connector: mock_tax
      operation: quote_order
      input:
        checkout_quote_id: { state: prepare_quote, field: checkout_quote_id }
        destination_country_code: { state: prepare_quote, field: destination_country_code }
        currency: { state: prepare_quote, field: currency }
        taxable_lines: { state: prepare_quote, field: taxable_lines }
      timeout: 2s
      retry:
        maximum_attempts: 3
        backoff: 100ms
        retry_on: [transport, timeout, http_429, http_5xx]
      next: checkout
      on_error: tax_quote_failed

  - id: checkout
    command:
      name: begin_checkout
      run_as: caller
      arguments:
        checkout_quote_id: { state: prepare_quote, field: checkout_quote_id }
        provider_checkout_quote_id: { state: request_tax_quote, field: checkout_quote_id }
        tax_quote_id: { state: request_tax_quote, field: tax_quote_id }
        tax_minor: { state: request_tax_quote, field: tax_minor }
        tax_code: { state: request_tax_quote, field: tax_code }
        tax_currency: { state: request_tax_quote, field: currency }
        request_id: { input: request_id }
      next: request_authorization

  - id: request_authorization
    request:
      connector: mock_payment
      operation: authorize
      input:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        amount_minor: { state: checkout, field: total_minor }
        currency: { state: checkout, field: currency }
        request_id: { activity_key: request_authorization }
      idempotency_key:
        stable: { run: id, state: request_authorization }
      timeout: 2s
      retry:
        maximum_attempts: 3
        backoff: 100ms
        retry_on: [transport, timeout, http_429, http_5xx]
      next: route_authorization_response
      on_error: reconcile_authorization

  - id: route_authorization_response
    when:
      cases:
        - rule: payment_was_authorized
          with:
            outcome: { state: request_authorization, field: status }
          next: record_authorization
        - matches:
            status: declined
          next: cancel_declined_checkout
        - matches:
            status: failed
          next: cancel_declined_checkout
      default: authorization_requires_manual_reconciliation

  - id: record_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        provider_authorization_id: { state: request_authorization, field: provider_authorization_id }
        provider_event_id: { state: request_authorization, field: provider_event_id }
        provider_reference: { state: request_authorization, field: provider_reference }
        amount_minor: { state: checkout, field: total_minor }
        payload: { state: request_authorization, field: normalized_payload }
      next: authorized

  - id: cancel_declined_checkout
    command:
      name: cancel_order
      run_as: caller
      arguments:
        order_id: { state: checkout, field: order_id }
        request_id: { activity_key: cancel_declined_checkout }
      next: record_decline

  - id: record_decline
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: checkout, field: payment_id }
        provider_event_id: { state: request_authorization, field: provider_event_id }
        outcome: { state: request_authorization, field: status }
        provider_reference: { state: request_authorization, field: provider_reference }
        payload: { state: request_authorization, field: normalized_payload }
      next: declined

  # A transport/lease terminal error does not prove that the provider skipped
  # the mutation. The read-only lookup uses the original activity key.
  - id: reconcile_authorization
    request:
      connector: mock_payment
      operation: lookup_operation
      input:
        payment_id: { state: checkout, field: payment_id }
        resource_kind: { literal: authorization }
        resource_id: { state: checkout, field: order_id }
        activity_key: { activity_key: request_authorization }
      timeout: 5s
      retry:
        maximum_attempts: 3
        backoff: 100ms
        retry_on: [transport, timeout, http_429, http_5xx]
      next: route_reconciled_authorization
      on_error: authorization_requires_manual_reconciliation

  - id: route_reconciled_authorization
    when:
      cases:
        - matches:
            found: true
            outcome: authorized
          next: record_reconciled_authorization
        - matches:
            found: true
            outcome: declined
          next: cancel_reconciled_decline
        - matches:
            found: true
            outcome: failed
          next: cancel_reconciled_decline
      default: authorization_requires_manual_reconciliation

  - id: record_reconciled_authorization
    command:
      name: authorize_payment
      run_as: payment_worker
      arguments:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        provider_authorization_id: { state: reconcile_authorization, field: provider_mutation_id }
        provider_event_id: { state: reconcile_authorization, field: provider_event_id }
        provider_reference: { state: reconcile_authorization, field: provider_reference }
        amount_minor: { state: reconcile_authorization, field: amount_minor }
        payload: { state: reconcile_authorization, field: normalized_payload }
      next: authorized

  - id: cancel_reconciled_decline
    command:
      name: cancel_order
      run_as: caller
      arguments:
        order_id: { state: checkout, field: order_id }
        request_id: { activity_key: cancel_reconciled_decline }
      next: record_reconciled_decline

  - id: record_reconciled_decline
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: checkout, field: payment_id }
        provider_event_id: { state: reconcile_authorization, field: provider_event_id }
        outcome: { state: reconcile_authorization, field: outcome }
        provider_reference: { state: reconcile_authorization, field: provider_reference }
        payload: { state: reconcile_authorization, field: normalized_payload }
      next: declined

  - id: authorized
    output:
      values:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        payment_status: { literal: authorized }

  - id: declined
    output:
      values:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        payment_status: { literal: declined }

  - id: tax_quote_failed
    fail:
      code: tax_quote_unavailable
      message: Tax could not be quoted before checkout committed

  - id: authorization_requires_manual_reconciliation
    fail:
      code: payment_authorization_requires_reconciliation
      message: The authorization outcome is ambiguous; inventory remains reserved pending reconciliation
