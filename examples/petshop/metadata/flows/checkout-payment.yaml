name: checkout_payment
source: default
permissions:
  - role: customer
    owner_session_variable: x-donat-user-id
input:
  - { name: cart_id, type: bigint! }
  - { name: request_id, type: uuid! }
idempotency:
  key: { input: request_id }
  scope:
    - { session_variable: x-donat-user-id }
output:
  - { name: order_id, type: uuid! }
  - { name: payment_id, type: uuid! }
  - { name: payment_status, type: String! }
start_at: checkout
states:
  - id: checkout
    command:
      name: begin_checkout
      run_as: caller
      arguments:
        cart_id: { input: cart_id }
        request_id: { input: request_id }
      next: authorize_payment

  - id: authorize_payment
    request:
      connector: mock_payment
      operation: authorize
      input:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        amount_minor: { state: checkout, field: total_minor }
        currency: { state: checkout, field: currency }
        request_id: { input: request_id }
      idempotency_key:
        stable: { run: id, state: authorize_payment }
      timeout: 2s
      retry:
        maximum_attempts: 3
        backoff: 100ms
        retry_on: [transport, timeout, http_429, http_5xx]
      next: await_outcome
      on_error: release_after_provider_failure

  - id: await_outcome
    wait:
      connector: mock_payment
      event: payment_outcome
      verification: required
      persist_before_match: true
      correlate:
        payment_id: { state: checkout, field: payment_id }
      deadline: 15m
      next: route_outcome
      on_timeout: release_after_expiry

  - id: route_outcome
    when:
      cases:
        - rule: payment_was_authorized
          with:
            outcome: { event: outcome }
          next: record_authorized_outcome
      default: record_declined_outcome

  - id: record_authorized_outcome
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: checkout, field: payment_id }
        provider_event_id: { event: provider_event_id }
        outcome: { event: outcome }
        provider_reference: { event: provider_reference }
        payload: { event: normalized_payload }
      next: authorized

  - id: record_declined_outcome
    command:
      name: record_payment_outcome
      run_as: payment_worker
      arguments:
        payment_id: { state: checkout, field: payment_id }
        provider_event_id: { event: provider_event_id }
        outcome: { event: outcome }
        provider_reference: { event: provider_reference }
        payload: { event: normalized_payload }
      next: declined

  - id: release_after_expiry
    command:
      name: release_expired_checkout
      run_as: payment_worker
      arguments:
        order_id: { state: checkout, field: order_id }
        deadline_id: { run: id }
      next: expired

  - id: release_after_provider_failure
    command:
      name: release_expired_checkout
      run_as: payment_worker
      arguments:
        order_id: { state: checkout, field: order_id }
        deadline_id: { run: id }
      next: provider_request_failed

  - id: authorized
    output:
      values:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        payment_status: { literal: authorized }

  - id: declined
    output:
      values:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        payment_status: { literal: declined }

  - id: expired
    output:
      values:
        order_id: { state: checkout, field: order_id }
        payment_id: { state: checkout, field: payment_id }
        payment_status: { literal: expired }

  - id: provider_request_failed
    fail:
      code: payment_provider_unavailable
      message: Payment provider could not process the authorization request
