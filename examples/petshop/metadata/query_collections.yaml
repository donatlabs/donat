- name: petshop
  definition:
    queries:
      - name: Products
        query: |
          query Products {
            product(where: {status: {_eq: "published"}}, order_by: {slug: asc}) {
              slug
              title
              variants(order_by: {sku: asc}) {
                sku
                price_minor
                currency
                stock {
                  available_quantity
                }
              }
            }
          }
      - name: ProductBySlug
        query: |
          query ProductBySlug($slug: String!) {
            product(where: {slug: {_eq: $slug}}) {
              slug
              title
              description
              variants(order_by: {sku: asc}) {
                sku
                price_minor
                currency
                stock {
                  available_quantity
                }
              }
            }
          }
      - name: Cart
        query: |
          query Cart {
            cart(order_by: {id: asc}) {
              id
              customer_id
              status
              lines(order_by: {id: asc}) {
                variant_id
                quantity
              }
            }
          }
      - name: UpsertCartLine
        query: |
          mutation UpsertCartLine($cart_id: int64!, $variant_id: int64!, $quantity: Int!) {
            insert_cart_line(
              objects: [{cart_id: $cart_id, variant_id: $variant_id, quantity: $quantity}]
              on_conflict: {
                constraint: cart_line_cart_id_variant_id_key
                update_columns: [quantity]
              }
            ) {
              returning {
                cart_id
                variant_id
                quantity
              }
            }
          }
      - name: Orders
        query: |
          query Orders {
            orders(order_by: {created_at: asc}) {
              id
              order_status
              total_minor
              currency
            }
          }
      - name: OrderById
        query: |
          query OrderById($id: uuid!) {
            orders(where: {id: {_eq: $id}}) {
              id
              order_status
              total_minor
              currency
              lines(order_by: {id: asc}) {
                variant_id
                quantity
                unit_price_minor
                line_total_minor
              }
            }
          }
