table:
  name: customer
  schema: public
configuration:
  column_config:
    customer_id:
      comment: >-
        Stable customer identity equal to the X-Donat-User-Id session variable.
        A customer role may only read or edit a row whose customer_id matches it.
array_relationships:
  - name: orders
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: orders
          schema: public
  - name: addresses
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: customer_address
          schema: public
  - name: carts
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: cart
          schema: public
select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - customer_id
        - name
        - email
      filter:
        customer_id:
          _eq: X-Donat-User-Id
  - role: support
    permission:
      columns: "*"
      filter: {}
update_permissions:
  - role: customer
    permission:
      columns:
        - name
        - email
      filter:
        customer_id:
          _eq: X-Donat-User-Id
      check:
        customer_id:
          _eq: X-Donat-User-Id
