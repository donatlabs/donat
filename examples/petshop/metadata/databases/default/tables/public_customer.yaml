table:
  name: customer
  schema: public
configuration:
  column_config:
    customer_id:
      comment: >-
        Stable customer identity equal to the X-Donat-User-Id session variable.
        A customer role may only read or edit a row whose customer_id matches it.
attachments:
  # `avatar` holds an upload id, stored on the `local` backend. There is no role
  # list here on purpose: a customer may ask for an upload URL because the
  # update permission below lets it write the column, and may read a download
  # URL because the select permission exposes it.
  - column: avatar
    backend: media
    max_bytes: 2097152
    media_types:
      - image/png
      - image/jpeg
    # An avatar is shown to anyone who can see the customer, so it is published
    # rather than signed: the URL is stable and immutable, a CDN caches it
    # forever, and reading it costs no signature. Publishing is a real grant —
    # whoever holds the URL sees the picture — and never inferred, which is why
    # it is written here beside the permissions.
    public: true
array_relationships:
  - name: orders
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: orders
          schema: public
  - name: addresses
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: customer_address
          schema: public
  - name: carts
    using:
      foreign_key_constraint_on:
        column: customer_id
        table:
          name: cart
          schema: public
select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - customer_id
        - name
        - email
        - avatar
      filter:
        customer_id:
          _eq: X-Donat-User-Id
  - role: support
    permission:
      columns: "*"
      filter: {}
update_permissions:
  - role: customer
    permission:
      columns:
        - name
        - email
        - avatar
      filter:
        customer_id:
          _eq: X-Donat-User-Id
      check:
        customer_id:
          _eq: X-Donat-User-Id
