table:
  name: category
  schema: public
array_relationships:
  - name: products
    using:
      foreign_key_constraint_on:
        column: category_id
        table:
          name: product
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
      unbounded: catalogue
  - role: customer
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
      unbounded: catalogue
  - role: staff
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
      unbounded: operator
insert_permissions:
  - role: staff
    permission:
      check: {}
      columns:
        - slug
        - name
      unbounded: operator
update_permissions:
  - role: staff
    permission:
      columns:
        - slug
        - name
      filter: {}
      check: {}
      unbounded: operator
delete_permissions:
  - role: staff
    permission:
      filter: {}
      unbounded: operator
