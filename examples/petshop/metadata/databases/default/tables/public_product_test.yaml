# The public catalogue: what an anonymous shopper may read.
tests:
  - name: anonymous shoppers browse published products and active variants
    steps:
      - description: Anonymous shoppers can browse only published products and active variants.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: anonymous
        query:
          query: |
            query PublicCatalog {
              product(where: {status: {_eq: "published"}}, order_by: {slug: asc}) {
                slug
                variants(order_by: {sku: asc}) {
                  sku
                  price_minor
                  currency
                  stock {
                    available_quantity
                  }
                }
              }
            }
        response:
          data:
            product:
              - slug: cat-scratcher
                variants:
                  - sku: CAT-SCRATCH-POST
                    price_minor: 1599
                    currency: USD
                    stock:
                      available_quantity: 5
              - slug: dog-kibble
                variants:
                  - sku: DOG-CHICKEN-1KG
                    price_minor: 1999
                    currency: USD
                    stock:
                      available_quantity: 1
                  - sku: DOG-SALMON-1KG
                    price_minor: 2499
                    currency: USD
                    stock:
                      available_quantity: 3
