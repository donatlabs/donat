table:
  name: inventory_reservation
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: variant
    using:
      foreign_key_constraint_on: variant_id
select_permissions:
  - role: staff
    permission:
      columns: "*"
      filter: {}
      unbounded: operator
  - role: payment_worker
    permission:
      columns:
        - id
        - order_id
        - variant_id
        - quantity
        - status
      filter: {}
      unbounded: worker
command_select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - order_id
        - variant_id
        - quantity
        - status
      filter:
        order:
          customer_id:
            _eq: X-Donat-User-Id
insert_permissions:
  - role: customer
    permission:
      columns: "*"
      check:
        order:
          customer_id:
            _eq: X-Donat-User-Id
update_permissions:
  - role: payment_worker
    permission:
      columns:
        - status
      filter: {}
      check: {}
      unbounded: worker
