table:
  name: inventory_reservation
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: variant
    using:
      foreign_key_constraint_on: variant_id
select_permissions:
  - role: staff
    permission:
      columns: "*"
      filter: {}
  - role: payment_worker
    permission:
      columns:
        - id
        - order_id
        - variant_id
        - quantity
        - status
      filter: {}
