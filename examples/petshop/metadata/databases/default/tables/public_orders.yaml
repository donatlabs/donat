table:
  name: orders
  schema: public
object_relationships:
  - name: customer
    using:
      foreign_key_constraint_on: customer_id
array_relationships:
  - name: lines
    using:
      foreign_key_constraint_on:
        column: order_id
        table:
          name: order_line
          schema: public
select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
        - created_at
      filter:
        customer_id:
          _eq: X-Donat-User-Id
  - role: staff
    permission:
      columns: "*"
      filter: {}
      unbounded: operator
  - role: fulfilment
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
        - created_at
      # Fulfilment owns an order from the moment its payment is committed:
      # allocation and shipment run against an authorized order, and capture
      # only follows a shipped label. Restricting this to `paid` predated the
      # authorize-then-capture flow and hid every fulfilable order.
      filter:
        order_status:
          _in: [authorized, paid, fulfilled]
      unbounded: operator
  - role: support
    permission:
      columns: "*"
      filter: {}
      unbounded: operator
  - role: payment_worker
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
      filter: {}
      unbounded: worker
  - role: marketplace_worker
    permission:
      columns: "*"
      filter: {}
      unbounded: worker
  - role: subscription_worker
    permission:
      columns: "*"
      filter: {}
      unbounded: worker
command_select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - customer_id
        - checkout_quote_id
        - order_status
        - cancellation_reason
        - subtotal_minor
        - discount_minor
        - shipping_minor
        - tax_minor
        - total_minor
        - currency
      filter:
        customer_id:
          _eq: X-Donat-User-Id
command_insert_permissions:
  - role: customer
    permission:
      columns: "*"
      check:
        customer_id:
          _eq: X-Donat-User-Id
insert_permissions:
  - role: subscription_worker
    permission:
      columns: "*"
      check: {}
      unbounded: worker
command_update_permissions:
  - role: customer
    permission:
      columns:
        - order_status
        - cancellation_reason
      filter:
        customer_id:
          _eq: X-Donat-User-Id
      check:
        customer_id:
          _eq: X-Donat-User-Id
update_permissions:
  - role: support
    permission:
      columns:
        - order_status
        - cancellation_reason
      filter: {}
      check: {}
      unbounded: operator
  - role: payment_worker
    permission:
      columns:
        - order_status
      filter: {}
      check: {}
      unbounded: worker
