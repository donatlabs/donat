table:
  name: orders
  schema: public
object_relationships:
  - name: customer
    using:
      foreign_key_constraint_on: customer_id
array_relationships:
  - name: lines
    using:
      foreign_key_constraint_on:
        column: order_id
        table:
          name: order_line
          schema: public
select_permissions:
  - role: customer
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
        - created_at
      filter:
        customer_id:
          _eq: X-Donat-User-Id
  - role: staff
    permission:
      columns: "*"
      filter: {}
  - role: fulfilment
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
        - created_at
      filter:
        order_status:
          _eq: paid
  - role: support
    permission:
      columns: "*"
      filter: {}
  - role: payment_worker
    permission:
      columns:
        - id
        - customer_id
        - order_status
        - total_minor
        - currency
      filter: {}
  - role: marketplace_worker
    permission:
      columns: "*"
      filter: {}
  - role: subscription_worker
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: customer
    permission:
      columns: "*"
      check:
        customer_id:
          _eq: X-Donat-User-Id
  - role: subscription_worker
    permission:
      columns: "*"
      check: {}
update_permissions:
  - role: customer
    permission:
      columns:
        - order_status
        - cancellation_reason
      filter:
        customer_id:
          _eq: X-Donat-User-Id
      check:
        customer_id:
          _eq: X-Donat-User-Id
  - role: support
    permission:
      columns:
        - order_status
        - cancellation_reason
      filter: {}
      check: {}
  - role: payment_worker
    permission:
      columns:
        - order_status
      filter: {}
      check: {}
