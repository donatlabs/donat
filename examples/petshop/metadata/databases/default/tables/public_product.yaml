table:
  name: product
  schema: public
object_relationships:
  - name: category
    using:
      foreign_key_constraint_on: category_id
array_relationships:
  - name: variants
    using:
      foreign_key_constraint_on:
        column: product_id
        table:
          name: product_variant
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: "*"
      filter:
        status:
          _eq: published
      allow_aggregations: true
  - role: customer
    permission:
      columns: "*"
      filter:
        status:
          _eq: published
      allow_aggregations: true
  - role: staff
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: staff
    permission:
      check: {}
      columns:
        - category_id
        - slug
        - title
        - description
        - status
      # The null-is-acceptable spelling. description is nullable and stays
      # optional — a product may be published before anyone writes copy for
      # it — but a description that exists must be worth reading.
      #
      # `when_present` is the escape from "unknown never satisfies a
      # validator", and it is a declaration rather than an arm of the
      # expression: the rule profile has no flow-sensitive refinement, so an
      # `is_null(description) || size(description) >= 20` would not type check
      # — `size` would still be reading a nullable value. Declaring the
      # presence here excludes the null rows and makes the column non-null
      # inside this one expression.
      validate:
        - expression: 'size(title) >= 3'
          message: title must be at least 3 characters
        - expression: 'size(description) >= 20'
          when_present: description
          message: description must be at least 20 characters when present
update_permissions:
  - role: staff
    permission:
      columns:
        - category_id
        - slug
        - title
        - description
        - status
      filter: {}
      check: {}
      validate:
        - expression: 'size(title) >= 3'
          message: title must be at least 3 characters
        - expression: 'size(description) >= 20'
          when_present: description
          message: description must be at least 20 characters when present
delete_permissions:
  - role: staff
    permission:
      filter: {}
