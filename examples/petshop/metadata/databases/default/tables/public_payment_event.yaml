table:
  name: payment_event
  schema: public
object_relationships:
  - name: payment
    using:
      foreign_key_constraint_on: payment_id
select_permissions:
  - role: payment_worker
    permission:
      columns:
        - id
        - payment_id
        - event_type
        - provider_event_id
        - created_at
      filter: {}
      unbounded: worker
command_select_permissions:
  - role: reconciliation_worker
    permission:
      columns:
        - id
        - provider_event_id
        - provider_amount_minor
        - provider_currency
        - provider_status
        - provider_reference
      filter: {}
      unbounded: worker
insert_permissions:
  - role: payment_worker
    permission:
      columns: "*"
      check: {}
      unbounded: worker
  - role: reconciliation_worker
    permission:
      columns: "*"
      check: {}
      unbounded: worker
