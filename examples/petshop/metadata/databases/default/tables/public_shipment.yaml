table:
  name: shipment
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: staff
    permission:
      columns: "*"
      filter: {}
  - role: fulfilment
    permission:
      columns: "*"
      filter:
        order:
          order_status:
            _eq: paid
