- table: {schema: public, name: organization}
  # A buying organization is somebody's employer, and its credit line is its
  # own business, so the people are bounded by belonging to it — the same
  # traversal a seller is bounded by, on the other side of the marketplace.
  #
  # `b2b_finance` is deliberately not among them. It is the role the approval
  # flow runs its own steps as (`run_as: b2b_finance`), and a fixed process
  # role has no caller session to read a membership out of. `donat validate`
  # refuses a permission that asks one to, which is how the line between a
  # person's role and a worker's got drawn here rather than by opinion.
  array_relationships:
    - name: memberships
      using:
        manual_configuration:
          remote_table: {schema: public, name: organization_membership}
          column_mapping: {id: organization_id}
  select_permissions:
    - role: b2b_buyer
      permission: {columns: "*", filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}
    - role: b2b_approver
      permission: {columns: "*", filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}
    - role: b2b_finance
      permission: {columns: "*", filter: {}, unbounded: worker}
  update_permissions:
    - role: b2b_approver
      permission: {columns: "*", filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}, check: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}
    - role: b2b_finance
      permission: {columns: "*", filter: {}, check: {}, unbounded: worker}

- table: {schema: public, name: organization_membership}
  select_permissions:
    - role: b2b_buyer
      permission:
        columns: "*"
        filter: {user_id: {_eq: X-Donat-User-Id}}

- table: {schema: public, name: quote}
