- table: {schema: public, name: vendor_order}
  # A marketplace sells other people's goods, so a seller is not the shop: it
  # sees its own lines of an order and nobody else's. The bound is a traversal
  # of the membership that says who a person sells for — declared here rather
  # than left to each reader, because a seller reading another seller's orders
  # is the failure this table exists to avoid.
  array_relationships:
    - name: memberships
      using:
        manual_configuration:
          remote_table: {schema: public, name: vendor_membership}
          column_mapping: {vendor_id: vendor_id}
  select_permissions:
    - role: vendor
      permission:
        columns: "*"
        filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}
    - role: marketplace_worker
      permission: {columns: "*", filter: {}, unbounded: worker}
  insert_permissions:
    - role: marketplace_worker
      permission: {columns: "*", check: {}, unbounded: worker}
  update_permissions:
    - role: vendor
      permission:
        columns: "*"
        filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}
        check: {memberships: {user_id: {_eq: X-Donat-User-Id}}}

- table: {schema: public, name: vendor_membership}
  select_permissions:
    - role: vendor
      permission:
        columns: "*"
        filter: {user_id: {_eq: X-Donat-User-Id}}

- table: {schema: public, name: vendor_order_acceptance}
  # Accepting an order is a seller acting on its own line. Both halves are
  # bounded: what it may read, and what it may write.
  array_relationships:
    - name: memberships
      using:
        manual_configuration:
          remote_table: {schema: public, name: vendor_membership}
          column_mapping: {vendor_id: vendor_id}
  command_select_permissions:
    - role: vendor
      permission:
        columns: [id, vendor_order_id, vendor_id, acceptance_id]
        filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}
  insert_permissions:
    - role: vendor
      permission: {columns: "*", check: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}

- table: {schema: public, name: vendor_payout_candidate}
  select_permissions:
    - role: marketplace_worker
      permission: {columns: "*", filter: {}, unbounded: worker}

- table: {schema: public, name: vendor_payout}
  # A seller may read its own payouts and nobody else's. Without this a seller
  # could not see what it is owed at all, which is the other half of running a
  # marketplace: isolation is not only what somebody may not see.
  array_relationships:
    - name: memberships
      using:
        manual_configuration:
          remote_table: {schema: public, name: vendor_membership}
          column_mapping: {vendor_id: vendor_id}
  select_permissions:
    - role: vendor
      permission: {columns: "*", filter: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}
    - role: payout_worker
      permission: {columns: "*", filter: {}, unbounded: worker}
    - role: support
      permission: {columns: "*", filter: {}, unbounded: operator}
  command_select_permissions:
    - role: marketplace_worker
      permission:
        columns:
          [id, payout_key, payout_cycle_id, vendor_id, net_minor, currency,
           status]
        filter: {}
        unbounded: worker
  insert_permissions:
    - role: marketplace_worker
      permission: {columns: "*", check: {}, unbounded: worker}
  update_permissions:
    - role: payout_worker
      permission: {columns: "*", filter: {}, check: {}, unbounded: worker}
    - role: support
      permission: {columns: "*", filter: {}, check: {}, unbounded: operator}

- table: {schema: public, name: vendor_payout_event}
