- table: {schema: public, name: purchase_approval}
  # An approval has no organization of its own — it belongs to the quote it
  # approves. So the bound is one hop further, through that quote, rather than
  # a column copied onto this table to make the filter shorter.
  object_relationships:
    - name: quote
      using:
        foreign_key_constraint_on: quote_id
  select_permissions:
    - role: b2b_approver
      permission: {columns: "*", filter: {quote: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}}
    - role: b2b_finance
      permission: {columns: "*", filter: {}, unbounded: worker}
  command_select_permissions:
    - role: b2b_buyer
      permission:
        columns: [id, quote_id, status]
        filter: {quote: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}
  insert_permissions:
    - role: b2b_buyer
      permission: {columns: "*", check: {quote: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}}
  update_permissions:
    - role: b2b_approver
      permission: {columns: "*", filter: {quote: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}, check: {quote: {memberships: {user_id: {_eq: X-Donat-User-Id}}}}}
    - role: b2b_finance
      permission: {columns: "*", filter: {}, check: {}, unbounded: worker}

