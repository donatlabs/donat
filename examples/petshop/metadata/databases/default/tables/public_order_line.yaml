table:
  name: order_line
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: variant
    using:
      foreign_key_constraint_on: variant_id
select_permissions:
  - role: customer
    permission:
      columns: "*"
      filter:
        order:
          customer_id:
            _eq: X-Donat-User-Id
  - role: staff
    permission:
      columns: "*"
      filter: {}
  - role: fulfilment
    permission:
      columns: "*"
      filter:
        order:
          order_status:
            _eq: paid
  - role: support
    permission:
      columns: "*"
      filter: {}
command_select_permissions:
  - role: subscription_worker
    permission:
      columns:
        - id
        - order_id
        - variant_id
        - quantity
        - unit_price_minor
        - line_total_minor
        - currency
      filter: {}
  - role: veterinary_reviewer
    permission:
      columns:
        - id
        - prescription_release_id
      filter: {}
insert_permissions:
  - role: customer
    permission:
      columns: "*"
      check:
        order:
          customer_id:
            _eq: X-Donat-User-Id
  - role: subscription_worker
    permission:
      columns: "*"
      check: {}
update_permissions:
  - role: veterinary_reviewer
    permission:
      columns:
        - prescription_release_id
      filter: {}
      check: {}
