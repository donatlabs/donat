# What each role is refused: customer data across customers, prices and
# totals from the storefront, lifecycle mutations from anyone but the role
# that owns them, and the MCP surface as a way around any of it. Seeded with
# customer-1's cart and order so that customer-2 has something not to see.
tests:
  - name: every role is refused what it does not own
    steps:
      - sql: |
          INSERT INTO cart (customer_id) VALUES ('customer-1');
          INSERT INTO orders (id, customer_id)
            VALUES ('00000000-0000-0000-0000-000000000001', 'customer-1');
      - description: Anonymous visitors cannot query customer data.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: anonymous
        query:
          query: |
            query {
              customer { customer_id }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.customer
                code: validation-failed
              message: "field 'customer' not found in type: 'query_root'"

      - description: A customer cannot read another customer's carts or orders.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: customer
          X-Donat-User-Id: customer-2
        query:
          query: |
            query {
              cart(where: {customer_id: {_eq: "customer-1"}}) { id }
              orders(where: {customer_id: {_eq: "customer-1"}}) { id }
            }
        response:
          data:
            cart: []
            orders: []

      - description: Customers cannot create catalogue variants with a price.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: customer
          X-Donat-User-Id: customer-1
        query:
          query: |
            mutation {
              insert_product_variant(objects: [{product_id: 1, sku: "BAD-PRICE", price_minor: 1, currency: "USD"}]) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.insert_product_variant
                code: validation-failed
              message: "field 'insert_product_variant' not found in type: 'mutation_root'"

      - description: Customers cannot write order line prices.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: customer
          X-Donat-User-Id: customer-1
        query:
          query: |
            mutation {
              insert_order_line(objects: [{order_id: "00000000-0000-0000-0000-000000000001", variant_id: 1, quantity: 1, unit_price_minor: 1, currency: "USD", line_total_minor: 1}]) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.insert_order_line
                code: validation-failed
              message: "field 'insert_order_line' not found in type: 'mutation_root'"

      - description: Customers cannot write order totals or lifecycle state.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: customer
          X-Donat-User-Id: customer-1
        query:
          query: |
            mutation {
              update_orders(where: {id: {_eq: "00000000-0000-0000-0000-000000000001"}}, _set: {total_minor: 1, order_status: "paid"}) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.update_orders
                code: validation-failed
              message: "field 'update_orders' not found in type: 'mutation_root'"

      - description: Customers cannot reserve stock directly.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: customer
          X-Donat-User-Id: customer-1
        query:
          query: |
            mutation {
              update_inventory_stock(where: {variant_id: {_eq: 1}}, _set: {reserved: 1}) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.update_inventory_stock
                code: validation-failed
              message: "field 'update_inventory_stock' not found in type: 'mutation_root'"

      - description: Staff cannot invoke fulfilment-only shipment mutations.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: staff
        query:
          query: |
            mutation {
              update_shipment(where: {id: {_eq: 1}}, _set: {fulfilment_status: "shipped"}) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.update_shipment
                code: validation-failed
              message: "field 'update_shipment' not found in type: 'mutation_root'"

      - description: Staff cannot invoke support-only refund mutations.
        url: /v1/graphql
        status: 200
        headers:
          X-Donat-Role: staff
        query:
          query: |
            mutation {
              update_refund(where: {id: {_eq: 1}}, _set: {status: "refunded"}) {
                affected_rows
              }
            }
        response:
          errors:
            - extensions:
                path: $.selectionSet.update_refund
                code: validation-failed
              message: "field 'update_refund' not found in type: 'mutation_root'"

      - description: >-
          A request that names no role is refused before any permission is read.
          There is no admin role and no header this engine believes on its own: a
          role comes from a verified JWT or from the authentication hook, and this
          suite's hook refuses a request that named none.
        url: /v1/graphql
        status: 401
        query:
          query: |
            query { product { slug } }
        response:
          errors:
            - extensions:
                path: $
                code: access-denied
              message: "Authentication hook unauthorized this request"

      - description: MCP cannot bypass anonymous catalog-only permissions to read customers.
        url: /mcp
        method: POST
        status: 200
        headers:
          X-Donat-Role: anonymous
        body:
          jsonrpc: "2.0"
          id: 1
          method: tools/call
          params:
            name: query
            arguments:
              table: customer
              columns:
                - customer_id
        response:
          jsonrpc: "2.0"
          id: 1
          result:
            isError: true
