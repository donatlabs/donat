  - name: lookup_capture
    version: v1
    method: POST
    path: /v1/payment-capture-lookups
    input_contract:
      payment_id: uuid!
      shipment_id: uuid!
      amount_minor: bigint!
      activity_key: string!
    body:
      payment_id: { input: payment_id }
      shipment_id: { input: shipment_id }
      amount_minor: { input: amount_minor }
      activity_key: { input: activity_key }
    success_statuses: [200]
    response:
      resolution: { json_pointer: /resolution, type: ProviderLookupResolution! }
      captured:
        json_pointer: /captured
        type: "[CaptureLookupCaptured!]!"
        maximum_items: 1
      terminal_absences:
        json_pointer: /terminal_absences
        type: "[CaptureLookupAbsence!]!"
        maximum_items: 1
    success_contract:
      discriminator: resolution
      cases:
        mutation_found:
          exactly_one_non_empty: captured
          empty: terminal_absences
          captured_outcome: captured
        terminal_absence:
          exactly_one_non_empty: terminal_absences
          empty: captured
      unproven_absence:
        error: { class: invariant, code: payment_capture_outcome_ambiguous }
    effect: read_only
    bounds:
      deadline_ms: 5000
      maximum_calls: 1
      maximum_pages: 1
      maximum_items: 1
