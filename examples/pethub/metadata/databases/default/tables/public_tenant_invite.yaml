table:
  name: tenant_invite
  schema: public
configuration:
  column_config:
    code_hash:
      comment: >-
        Only the digest is stored, under a unique constraint. The code itself
        is generated by the caller of invite_member and never returned by any
        column — an invitation that can be read back is a standing grant of
        whatever role it names. The unguessable code is also what authorizes
        the one unscoped read in the whole example (accept_invite).
    role_name:
      comment: >-
        The IAM role the invitee receives. Null means "use the tenant's
        default_member_role at the moment of acceptance", so an invitation
        sent before a policy change follows the new policy, not the old one.

# An ordinary tenant-keyed table: tenancy.yaml does not exempt it. The owner's
# view of outstanding invitations is therefore scoped by the compiler like
# everything else.
select_permissions:
  - role: merchant_owner
    permission:
      columns: [id, email, role_name, expires_at, accepted_at, created_at]
      filter: {}

delete_permissions:
  - role: merchant_owner
    permission:
      filter:
        accepted_at:
          _is_null: true

command_insert_permissions:
  - role: merchant_owner
    permission:
      columns: [id, tenant_id, code_hash, email, role_name, expires_at, invited_by]
      check: {}

command_select_permissions:
  # accept_invite reads this row before the caller belongs to the tenant. The
  # step declares `tenant: unscoped` and the command derives its tenant from
  # what this row says; the filter below is the rest of the defence — an
  # invitation is single-use and its own row records that.
  - role: platform_visitor
    permission:
      columns: [id, tenant_id, role_name, email, expires_at, accepted_at]
      filter:
        accepted_at:
          _is_null: true

command_update_permissions:
  - role: platform_visitor
    permission:
      columns: [accepted_at, accepted_by]
      filter:
        accepted_at:
          _is_null: true
      check: {}
