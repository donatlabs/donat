name: grant_role_action
source: default
permissions:
  - role: merchant_owner
# Gated on `iam:administer` by iam.yaml.

# Granting an action is the one operation in a tenant that can widen its own
# caller's power, so it is command-only in both directions: iam_role_grant has
# no ordinary insert or delete permission for any role, and `insert_iam_role_grant`
# therefore exists on no schema. iam.yaml `reserved_actions` is the outer
# boundary — whatever a merchant writes here, `platform:*`, `tenant:create`
# and `tenant:suspend` are refused at compile time.

arguments:
  - name: role_name
    type: string!
  - name: action
    type: string!
  - name: request_id
    type: uuid!

steps:
  # Proves the role belongs to this tenant before granting anything to it.
  - name: role
    select_one:
      table: { schema: public, name: iam_role }
      by:
        name: { arg: role_name }
      returning: [name, compiled_role]
      require_found: true

  - name: grant
    insert:
      table: { schema: public, name: iam_role_grant }
      object:
        role_name: { step: role, column: name }
        action: { arg: action }
      returning: [role_name, action]

result:
  role_name: { step: grant, column: role_name }
  action: { step: grant, column: action }

idempotency:
  key: { argument: request_id }
  scope:
    - { argument: role_name }
  retention: 365d
