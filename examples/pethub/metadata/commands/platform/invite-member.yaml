name: invite_member
source: default
permissions:
  - role: merchant_owner
# iam.yaml additionally gates this on `iam:administer`, so an owner may
# delegate staff management to a role they define without handing over the
# store itself.

arguments:
  - name: invite_id
    type: uuid!
  - name: email
    type: string!
  - name: code_hash
    type: string!
    description: >-
      The digest of a single-use code generated by the caller. The engine never
      sees the code, and no column ever returns it — an invitation that can be
      read back is a standing grant of the role it names.
  - name: role_name
    type: string
    description: >-
      Null means "whatever this tenant's default_member_role is at the moment
      of acceptance", so an invitation sent before a policy change follows the
      new policy rather than the old one.
  - name: expires_at
    type: timestamptz!
  - name: request_id
    type: uuid!

steps:
  # Resolving the role here proves it exists in THIS tenant before the
  # invitation goes out. The tenant predicate on the lookup is injected by the
  # compiler, so a role name from another store cannot be smuggled in.
  - name: invited_role
    select_one:
      table: { schema: public, name: iam_role }
      by:
        name: { arg: role_name }
      returning: [name, compiled_role]
      require_found: false

  - name: invite
    insert:
      table: { schema: public, name: tenant_invite }
      object:
        id: { arg: invite_id }
        code_hash: { arg: code_hash }
        email: { arg: email }
        role_name: { arg: role_name }
        expires_at: { arg: expires_at }
        invited_by: { session_variable: x-donat-user-id }
      returning: [id, email, role_name, expires_at]

result:
  invite_id: { step: invite, column: id }
  email: { step: invite, column: email }
  role_name: { step: invite, column: role_name }
  expires_at: { step: invite, column: expires_at }

idempotency:
  key: { argument: request_id }
  scope:
    - { argument: email }
  retention: 365d
